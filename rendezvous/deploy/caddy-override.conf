# A drop-in for Caddy's own caddy.service (the packaged unit stays as it
# is). setup-server.sh installs it as
# /etc/systemd/system/caddy.service.d/nereus.conf, writing GOMEMLIMIT from
# the server's memory in place of the placeholder below (the formula is in
# setup-server.sh and the rendezvous document, section 9.1).
#
# Caddy is the one front door of the rendezvous: if it stops, no Core and
# no client reaches the service. So it comes back on its own after any
# failure, the kernel ends the service before Caddy when memory runs out
# (the service's unit has the higher OOMScoreAdjust; ending the service
# also frees Caddy's proxied connections), and Go's runtime collects garbage
# harder as Caddy nears GOMEMLIMIT, a soft limit that keeps its memory near
# what it really holds.

[Service]
Restart=on-failure
RestartSec=2
OOMScoreAdjust=-100
Environment=GOMEMLIMIT=@GOMEMLIMIT@
