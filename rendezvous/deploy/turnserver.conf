# coturn configuration for the NereusSDR relay (rendezvous document
# section 8). Ubuntu 24.04's coturn 4.6.1 reads it as /etc/turnserver.conf.
#
# This file is the part that is the same on every server. setup-server.sh
# writes /etc/turnserver.conf as this file followed by a block of lines it
# works out on the server itself, which never enter the repository:
#
#   static-auth-secret   the shared secret, generated on the server
#   listening-ip         the server's public IPv4 and IPv6 addresses
#   relay-ip             the same addresses
#   cert, pkey           a self-signed key pair for the second UDP port
#                        (see "Ports" below; nothing verifies it)
#   total-quota          the relay's slots, RV_RELAY_SLOTS (see "Limits")
#   bps-capacity         slots x max-bps
#   realm                the service's host name
#
# None of those keys may appear here; setup-server.sh refuses a file that
# has them. Every key below is a coturn 4.6.1 option; `turnserver --help`
# describes each one.

# ---------------------------------------------------------------- Ports
#
# TURN and STUN over UDP only, on UDP 3478 and UDP 443, IPv4 and IPv6. No
# TCP port at all: TCP 80 and 443 belong to Caddy on the same server.
#
# coturn listens on two ports by role: listening-port (plain UDP and TCP)
# and tls-listening-port (TLS on TCP and DTLS on UDP). Its DTLS listener
# also answers plain STUN and TURN on the same port (coturn's own help for
# tls-listening-port says so), which is how UDP 443 answers plain TURN
# without a firewall redirect. That listener exists only while DTLS is on
# and a certificate is loaded, so setup-server.sh makes a self-signed pair
# for it. No DTLS session is ever set up with the server: the cipher list
# below is empty ("aNULL" and then its removal), so every DTLS handshake
# fails, while plain STUN and TURN on the same port are unaffected (both
# observed by rendezvous/tests/coturn-check.sh). no-tlsv1 and no-tlsv1_2
# alone do not stop DTLS in coturn 4.6.1 (observed); they stay as a second
# fence. The "DTLS over UDP 443" relay rung is DTLS end to end, inside TURN
# over UDP, between the Core and the client, never with coturn.
listening-port=3478
tls-listening-port=443
no-tcp
no-tls
no-tlsv1
no-tlsv1_2
cipher-list="aNULL:!aNULL"
# No RFC 5780 alternate ports (coturn would add listening-port + 1 and
# tls-listening-port + 1 on a host with two addresses of one family).
no-rfc5780
response-origin-only-with-rfc5780
no-stun-backward-compatibility

# Relay ports: 61000 to 65535, above Linux's default ephemeral range
# (32768 to 60999), so a relay never competes with another program's
# outgoing sockets, and clear of coturn's own UDP 443 and 3478. 4536
# ports, far more than the relay's slots.
min-port=61000
max-port=65535

# A client that reaches the server over IPv6 (rv6) gets an IPv6 relay
# address and one over IPv4 (rv4) an IPv4 one, unless it asks otherwise.
allocation-default-address-family=keep

# ---------------------------------------------------------------- Auth
#
# Time-limited credentials only (rendezvous document section 8): username
# "<unix expiry>:<station id>", password base64(HMAC-SHA1(secret,
# username)). No anonymous allocation, no user database, no static users.
use-auth-secret
fingerprint
# A nonce lasts 600 s; after that the client authenticates again, which is
# when coturn checks the credential's expiry again (see the coturn check in
# rendezvous/tests/coturn-check.sh for what that means for a refresh).
stale-nonce=600
# Plain STUN (binding requests) needs no credentials: the service hands
# clients stun: URLs without any (rendezvous document section 6.1).

# ---------------------------------------------------------------- Peers
#
# A relay may reach the public internet only. Loopback, private (RFC 1918),
# shared (100.64/10), link-local, unique-local, multicast and the rest of
# the special ranges below are refused in both families, including an IPv4
# address written in its IPv4-mapped or NAT64 IPv6 form, and the ranges
# coturn's own example configuration recommends denying: IETF protocol
# assignments, documentation, benchmarking, the discard prefix, Teredo and
# 6to4.
no-multicast-peers
no-tcp-relay
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=224.0.0.0-239.255.255.255
denied-peer-ip=240.0.0.0-255.255.255.255
# Not "::" itself: coturn 4.6.1 then refuses every IPv4 peer as well
# (observed in the coturn check). It refuses the unspecified address "::"
# on its own; the check shows that too.
denied-peer-ip=::1
denied-peer-ip=::ffff:0.0.0.0-::ffff:255.255.255.255
denied-peer-ip=64:ff9b::-64:ff9b::ffff:ffff
denied-peer-ip=64:ff9b:1::-64:ff9b:1:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=100::-100::ffff:ffff:ffff:ffff
denied-peer-ip=2001::-2001:0:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=2001:db8::-2001:db8:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=2002::-2002:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=ff00::-ffff:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# ---------------------------------------------------------------- Limits
#
# Bandwidth per allocation, in bytes a second, each direction apart:
# 80000 (640 kbit/s), above the largest session shape the pairing design
# sizes (four pans plus microphone, about 520 kbit/s, section 5.4) with room
# for bursts. coturn reserves this much of bps-capacity for every
# allocation while it lives, and refuses a new allocation (486) once
# nothing is left, so bps-capacity / max-bps is how many allocations run at
# once. setup-server.sh sets total-quota to the relay's slots
# (RV_RELAY_SLOTS, 128 by default) and bps-capacity to slots x max-bps, so
# the slots, not the bandwidth, are the limit.
max-bps=80000
# Allocations per username, that is per station id. Both ends of a session
# allocate with the same username, a session runs two ICE connections
# (control and media), and each connection may take up to 2 at each end
# (one per address family), so one session relayed at both ends takes 8. It
# keeps one Core from taking the whole relay; it does not bound the relay
# in total, since ids cost nothing (rendezvous document section 8).
user-quota=8
# An allocation lives at most an hour between refreshes.
max-allocate-lifetime=3600

# ---------------------------------------------------------------- Admin
no-cli
no-software-attribute
# Redis, SQL and the web admin are not used. The CLI is off above; there
# is no user database, so turnadmin has nothing to administer here.
no-dynamic-ip-list

# ---------------------------------------------------------------- Logs
#
# To syslog, that is the journal, and nowhere else: no log file, nothing on
# standard output. Not verbose. At this level coturn 4.6.1 logs its
# start-up and two kinds of line about clients (observed by
# rendezvous/tests/coturn-check.sh): a refused credential, naming its
# username (an expiry time and a Core's whole station id, never a device or
# a label), and a refused peer, naming the address a client asked to relay
# to. It logs neither successful allocations nor client addresses. coturn
# has no setting that shortens those two lines; the journal is readable by
# root and the adm group only, and rotates on its own. Binding requests are
# not logged (log-binding stays off).
syslog
no-stdout-log
