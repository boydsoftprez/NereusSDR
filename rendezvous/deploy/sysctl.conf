# Kernel settings for the rendezvous server, installed by
# rendezvous/deploy/setup-server.sh as /etc/sysctl.d/60-nereus-rendezvous.conf
# and applied at once (sysctl --load) and at every boot.
#
# At most 16384 bytes that a TCP socket has been given but not yet sent
# before its writer is made to wait. Caddy then stops taking a relay leg's
# datagrams from the WebSocket relay sooner when that leg's reader is slow,
# so they wait in the relay's own queue, which drops its oldest
# (rendezvous document section 12.5), rather than in Caddy's socket.
# Measured by rendezvous/tests/caddy-check.sh with a reader taking a
# quarter of what was sent: Caddy's socket towards it held about 39 KB
# without this setting and about 13 KB with it. It applies to every TCP
# socket on the host (Caddy, the service, SSH), which lose nothing at these
# rates: a writer that waits is woken once less than this is unsent.
#
# To undo it: rm /etc/sysctl.d/60-nereus-rendezvous.conf, then
#   sysctl -w net.ipv4.tcp_notsent_lowat=4294967295
net.ipv4.tcp_notsent_lowat = 16384
