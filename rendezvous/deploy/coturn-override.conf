# A drop-in for Ubuntu's own coturn.service (the packaged unit stays as it
# is). Installed as /etc/systemd/system/coturn.service.d/nereus.conf by
# rendezvous/deploy/setup-server.sh.
#
# Ubuntu's unit starts turnserver as the unprivileged turnserver account,
# which cannot bind UDP 443 (below 1024) on its own. This grants that one
# capability and nothing else, and adds sandboxing the packaged unit leaves
# out. coturn reads /etc/turnserver.conf (root:turnserver, 0640) and
# /etc/nereus-rendezvous/coturn/ (its DTLS key pair) and writes nothing;
# /var/lib/turn stays writable only because the package keeps its unused
# user database there.

[Unit]
# turnserver.conf names the server's public addresses (listening-ip), and
# coturn cannot bind an address the host does not have yet, so it waits
# for the network to be up at boot.
After=network-online.target
Wants=network-online.target

[Service]
AmbientCapabilities=CAP_NET_BIND_SERVICE
CapabilityBoundingSet=CAP_NET_BIND_SERVICE
NoNewPrivileges=yes
ProtectSystem=strict
ReadWritePaths=/var/lib/turn
ProtectHome=yes
ProtectClock=yes
ProtectHostname=yes
ProtectKernelLogs=yes
ProtectKernelModules=yes
ProtectKernelTunables=yes
ProtectControlGroups=yes
RestrictSUIDSGID=yes
RestrictNamespaces=yes
RestrictRealtime=yes
LockPersonality=yes
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX AF_NETLINK
UMask=0077
