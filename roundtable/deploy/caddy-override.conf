# A drop-in for Caddy's own caddy.service on the website server (nereus-web;
# the packaged unit stays as it is). roundtable/deploy/setup-server.sh
# installs it as /etc/systemd/system/caddy.service.d/nereus.conf, writing
# GOMEMLIMIT from the server's memory in place of the placeholder below,
# with the formula the rendezvous server uses (setup-server.sh has it).
#
# Caddy is the front door of the website and of Roundtable: if it stops,
# neither is reachable. So it comes back on its own after any failure, the
# kernel ends the Roundtable server before Caddy when memory runs out (the
# server's unit has OOMScoreAdjust=500; ending it also frees the
# connections Caddy holds for it), and Go's runtime collects garbage
# harder as Caddy nears GOMEMLIMIT, a soft limit that keeps its memory near
# what it really holds.

[Service]
Restart=on-failure
RestartSec=2
OOMScoreAdjust=-100
Environment=GOMEMLIMIT=@GOMEMLIMIT@
