# Isolated observation only; never a shipping or PR acceptance gate.
name: Kit startup observation
on:
  push:
    branches: ['codex/kit-startup-receipts']
permissions:
  contents: read
concurrency:
  group: kit-startup-observation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  observe:
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/kit-startup-receipts'
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Show the original selected toolchain
        run: |
          xcode-select -p
          swift --version
      - name: Observe the complete original Kit aggregate once
        env:
          KIT_HOSTED_SAMPLE_MODE: '1'
        run: python3 ios/scripts/kit-hosted-observe.py
      - name: Preserve observation even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kit-startup-observation-${{ github.sha }}
          path: ${{ env.KIT_HOSTED_ARTIFACT_DIR }}
          if-no-files-found: error
