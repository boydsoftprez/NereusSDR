# TEMPORARY causal diagnostic; source probes and this workflow must be removed before final uninstrumented acceptance.
name: iOS writer resume timing diagnostic
'on':
  push:
    branches:
    - codex/ios-queue-proof
permissions:
  contents: read
jobs:
  writer-resume-diagnostic:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Bind checkout and record sources
      shell: bash
      run: |
        set -euo pipefail
        evidence="$RUNNER_TEMP/writer-resume-diagnostic"
        mkdir -p "$evidence"
        {
          printf 'event=%s\nref=%s\nsha=%s\nhead=%s\nrunner_os=%s\nrunner_arch=%s\nrunner_name=%s\n' \
            "$GITHUB_EVENT_NAME" "$GITHUB_REF" "$GITHUB_SHA" "$(git rev-parse HEAD)" \
            "$RUNNER_OS" "$RUNNER_ARCH" "$RUNNER_NAME"
          git status --short
        } > "$evidence/identity.txt"
        test "$GITHUB_EVENT_NAME" = push
        test "$GITHUB_REF" = refs/heads/codex/ios-queue-proof
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        test -z "$(git status --porcelain)"
        shasum -a 256 \
          ios/NereusApp/App/AppModel.swift \
          ios/NereusApp/Band/BandSlicesModel.swift \
          ios/NereusApp/Main/MainScreenModel.swift \
          ios/NereusApp/App/SessionEventLanes.swift \
          ios/NereusApp/Tests/SessionEventLanesTests.swift \
          ios/NereusKit/Sources/NereusMedia/MediaControlClient.swift \
          ios/NereusKit/Sources/NereusMirror/CommandClient.swift \
          ios/NereusKit/Tests/NereusMediaTests/MediaControlClientTests.swift \
          ios/NereusKit/Tests/NereusMirrorTests/CommandClientTests.swift \
          ios/NereusKit/Sources/NereusKitTesting/FakeStation.swift \
          ios/NereusKit/Sources/NereusKitTesting/FakeStationConnection.swift \
          ios/NereusKit/Sources/NereusLink/StationSession.swift \
          ios/NereusKit/Sources/NereusMirror/MirrorStore.swift \
          ios/NereusApp/Tests/TuneUnderLoadTests.swift \
          ios/NereusApp/Band/BandModel.swift ios/NereusApp/Band/BandView.swift \
          ios/NereusKit/Sources/NereusBand/BandRenderer.swift \
          ios/NereusKit/Package.swift ios/project.yml \
          ios/scripts/generate-project.sh ios/scripts/sim-settle.sh \
          .github/workflows/ios.yml .github/workflows/ci.yml \
          .github/workflows/ios-ordered-intake-verification.yml > "$evidence/sources-before.sha256"
        printf "%s  %s\n" 2103e182166d1f5fc0d4a7c9c500df4e7b3fbe64b6d75211bbcdff1700905135 ios/NereusApp/Tests/TuneUnderLoadTests.swift | shasum -a 256 -c -
    - name: Select Xcode 27 and pin an existing iPhone 18 Pro Max
      shell: bash
      run: |
        set -euo pipefail
        evidence="$RUNNER_TEMP/writer-resume-diagnostic"
        xcode=$(ls -d /Applications/Xcode_27*.app | sort -V | tail -n 1)
        sudo xcode-select -s "$xcode"
        { xcode-select -p; xcodebuild -version; swift --version; } > "$evidence/toolchain.txt"
        xcrun simctl list devicetypes --json > "$evidence/device-types.json"
        xcrun simctl list devices available --json > "$evidence/available-devices.json"
        python3 - "$evidence" <<'DEVICE'
        import json,pathlib,re,os,uuid,sys
        root=pathlib.Path(sys.argv[1]); found=[]
        for runtime,devices in json.loads((root/'available-devices.json').read_text())['devices'].items():
            match=re.search(r'\.iOS-([0-9-]+)$',runtime)
            if not match: continue
            for device in devices:
                if device.get('name')=='iPhone 18 Pro Max' and device.get('isAvailable',True):
                    found.append((tuple(map(int,match[1].split('-'))),device['udid'],runtime,device))
        if not found: raise SystemExit('INVALID: no existing available iPhone 18 Pro Max')
        version,udid,runtime,device=max(found,key=lambda item:(item[0],item[1]))
        if version[0]!=27: raise SystemExit('INVALID: expected iOS 27 runtime')
        uuid.UUID(udid)
        (root/'selected-device.json').write_text(json.dumps({'runtime':runtime,**device},indent=2)+'\n')
        with open(os.environ['GITHUB_ENV'],'a') as out: out.write('DEVICE_UDID='+udid+'\n')
        DEVICE
    - name: Install XcodeGen and generate project
      run: |
        brew install xcodegen
        ios/scripts/generate-project.sh
    - name: Build app and tests before simulator boot
      shell: bash
      run: |
        set +e
        set -uo pipefail
        evidence="$RUNNER_TEMP/writer-resume-diagnostic"
        xcodebuild -project ios/NereusSDR.xcodeproj -scheme NereusSDR \
          -destination "platform=iOS Simulator,id=$DEVICE_UDID" \
          -derivedDataPath "$RUNNER_TEMP/writer-resume-dd" \
          -jobs 2 -parallel-testing-enabled NO build-for-testing \
          2>&1 | tee "$evidence/build.log"
        status=${PIPESTATUS[0]}
        printf '%s\n' "$status" > "$evidence/build.exit"
        exit "$status"
    - name: Boot and settle the pinned model after building
      shell: bash
      run: |
        set +e
        set -uo pipefail
        evidence="$RUNNER_TEMP/writer-resume-diagnostic"
        ios/scripts/sim-settle.sh 'iPhone 18 Pro Max' 2>&1 | tee "$evidence/settle.log"
        status=${PIPESTATUS[0]}
        printf '%s\n' "$status" > "$evidence/boot.exit"
        xcrun simctl list devices available --json > "$evidence/devices-after-settle.json"
        exit "$status"
    - name: Enumerate exactly the four unchanged original Tune methods
      shell: bash
      run: |
        set +e
        set -uo pipefail
        evidence="$RUNNER_TEMP/writer-resume-diagnostic"
        # Apple's xcodebuild manual defines flat enumeration as identifiers
        # suitable for subsequent -only-testing arguments; enumeration runs no tests.
        xcodebuild -project ios/NereusSDR.xcodeproj -scheme NereusSDR \
          -destination "platform=iOS Simulator,id=$DEVICE_UDID" \
          -derivedDataPath "$RUNNER_TEMP/writer-resume-dd" \
          -jobs 2 -parallel-testing-enabled NO test-without-building \
          -enumerate-tests -test-enumeration-style flat \
          -test-enumeration-format json \
          -test-enumeration-output-path "$evidence/enumeration.json" \
          2>&1 | tee "$evidence/enumeration.log"
        status=${PIPESTATUS[0]}
        printf '%s\n' "$status" > "$evidence/enumeration.exit"
        if [ "$status" -ne 0 ]; then
          exit "$status"
        fi
        python3 - "$evidence" <<'PYIDS'
        import json,pathlib,sys
        root=pathlib.Path(sys.argv[1])
        enumeration=json.loads((root/'enumeration.json').read_text())
        if enumeration.get('errors'): raise SystemExit('INVALID: enumeration errors')
        SUITES = {'tune': ('TuneUnderLoadTests', ['idleDragKeepsPace()', 'heldMainDragKeepsPace()', 'flatDragKeepsPace()', 'stackedDragKeepsPace()'])}
        for phase,(suite,methods) in SUITES.items():
            prefix='NereusSDRTests/'+suite+'/'
            expected={prefix+method for method in methods}; enabled=[]; disabled=[]
            for group in enumeration['values']:
                enabled.extend(item['identifier'] for item in group['enabledTests'] if item['identifier'].startswith(prefix))
                disabled.extend(item['identifier'] for item in group['disabledTests'] if item['identifier'].startswith(prefix))
            if disabled or len(enabled)!=len(expected) or set(enabled)!=expected:
                raise SystemExit(f'INVALID: {phase} missing/extra/duplicate/disabled identities: {enabled!r}, {disabled!r}')
            (root/(phase+'-identifiers.txt')).write_text('\n'.join(sorted(enabled))+'\n')
        (root/'enumeration-validation.txt').write_text('VALID: 4 original Tune methods\n')
        PYIDS
    - name: Run unchanged original Tune4 once with temporary host-only probes
      shell: bash
      run: |
        set +e
        set -uo pipefail
        evidence="$RUNNER_TEMP/writer-resume-diagnostic"
        test "$(cat "$evidence/enumeration-validation.txt")" = 'VALID: 4 original Tune methods' || exit 1
        selection=()
        while IFS= read -r identifier; do selection+=("-only-testing:$identifier"); done < "$evidence/tune-identifiers.txt"
        test "${#selection[@]}" -eq 4 || exit 1
        xcodebuild -project ios/NereusSDR.xcodeproj -scheme NereusSDR \
          -destination "platform=iOS Simulator,id=$DEVICE_UDID" \
          -derivedDataPath "$RUNNER_TEMP/writer-resume-dd" \
          -resultBundlePath "$evidence/tune.xcresult" -jobs 2 -parallel-testing-enabled NO \
          "${selection[@]}" test-without-building 2>&1 | tee "$evidence/tune.log"
        status=${PIPESTATUS[0]}
        printf '%s\n' "$status" > "$evidence/tune.exit"
        exit "$status"
    - name: Always collect bounded diagnostic evidence, including failed Tune assertions
      if: always()
      shell: bash
      run: |
        set +e
        set -uo pipefail
        evidence="$RUNNER_TEMP/writer-resume-diagnostic"
        mkdir -p "$evidence"
        if [ -f "$evidence/sources-before.sha256" ]; then
          shasum -a 256 -c "$evidence/sources-before.sha256" > "$evidence/sources-after-check.txt" 2>&1
          printf '%s\n' "$?" > "$evidence/sources-after-check.exit"
          sed 's/^[^ ]*  //' "$evidence/sources-before.sha256" | while IFS= read -r path; do shasum -a 256 "$path"; done > "$evidence/sources-after.sha256"
        fi
        for phase in tune; do
          if [ -d "$evidence/$phase.xcresult" ]; then
            for kind in summary tests; do
              xcrun xcresulttool get test-results "$kind" --path "$evidence/$phase.xcresult" > "$evidence/$phase-$kind.json" 2> "$evidence/$phase-$kind.error"
              printf '%s\n' "$?" > "$evidence/$phase-$kind.exit"
            done
          fi
        done
        git status --short > "$evidence/status-after.txt"
        python3 - "$evidence" <<'RESULTS'
        import json,pathlib,re,sys,math
        root=pathlib.Path(sys.argv[1]); report={'evidence':'INVALID / NEEDS INSPECTION','acceptance':'DIAGNOSTIC ONLY. Instrumented execution never qualifies uninstrumented performance, physical-phone or operator acceptance.'}
        def read(name):
            try:return (root/name).read_text().strip()
            except OSError:return ''
        def nodes(value):
            if isinstance(value,list):
                for item in value:yield from nodes(item)
            elif isinstance(value,dict):
                yield value
                for item in value.values():yield from nodes(item)
        try:
            device=json.loads(read('selected-device.json')); summary=json.loads(read('tune-summary.json')); tests=json.loads(read('tune-tests.json'))
            expected={s.removeprefix('NereusSDRTests/') for s in read('tune-identifiers.txt').splitlines()}
            methods=[n for n in nodes(tests) if n.get('nodeType')=='Test Case']
            assert len(expected)==4 and len(methods)==4 and {n.get('nodeIdentifier') for n in methods}==expected
            assert all(n.get('result') in ('Passed','Failed') for n in methods)
            assert not any(n.get('nodeType')=='Arguments' for n in nodes(tests))
            assert summary.get('totalTestCount')==4 and summary.get('passedTests',-10)+summary.get('failedTests',-10)==4
            assert summary['passedTests']==sum(n['result']=='Passed' for n in methods) and summary['failedTests']==sum(n['result']=='Failed' for n in methods)
            assert all(summary.get(k)==0 for k in ('skippedTests','expectedFailures'))
            configurations=summary['devicesAndConfigurations'];assert len(configurations)==1
            configuration=configurations[0]
            assert configuration.get('passedTests')==summary['passedTests'] and configuration.get('failedTests')==summary['failedTests']
            assert all(configuration.get(k)==0 for k in ('skippedTests','expectedFailures'))
            assert configuration['device']['deviceId']==device['udid'] and configuration['device']['modelName']=='iPhone 18 Pro Max'
            assert configuration['device']['platform']=='iOS Simulator' and configuration['device']['osVersion'].startswith('27.')
            assert read('tune.exit')==('0' if summary['failedTests']==0 else '65')
            assert all(read(name)=='0' for name in ('build.exit','boot.exit','enumeration.exit','sources-after-check.exit','tune-summary.exit','tune-tests.exit'))
            assert read('enumeration-validation.txt')=='VALID: 4 original Tune methods'
            log=read('tune.log'); lines=log.splitlines(); prefix='PhoneWriterResumeDiagnostic '
            flushes=[]; phases=[]; pending_phase=None
            for line in lines:
                if line.startswith('TuneUnderLoad '):
                    match=re.match(r'TuneUnderLoad (.+?) \(simulator\):',line)
                    if match: pending_phase={'phase':match[1],'tuneMetricLine':line}
                elif line.startswith(prefix):
                    flush=json.loads(line[len(prefix):]); flushes.append(flush)
                    assert pending_phase is not None
                    phases.append({**pending_phase,'diagnostic':flush}); pending_phase=None
            (root/'writer-resume-flushes.json').write_text(json.dumps(phases,indent=2)+'\n')
            assert {phase['phase'] for phase in phases}=={'nothing drawn','main held 15.0 ms a frame','2D','3D'}
            assert len(flushes)==4 and len({f['modelIdentity'] for f in flushes})==4
            required_counts=('truncatedRecords','unmatchedResolutions','unmatchedResumes','outstandingAtFlush','resolvedButNotResumedAtFlush','completedMatches')
            for flush in flushes:
                assert flush['schema']==1 and flush['flushReason']=='sessionStopped' and flush['recordLimit']==64
                assert 0<len(flush['records'])<=64
                assert all(isinstance(flush[key],int) and flush[key]>=0 for key in required_counts)
                assert isinstance(flush['counts'],dict) and all(isinstance(n,int) and n>=0 for n in flush['counts'].values())
                assert {'rebuildRequests','rebuildJobs'}.issubset(flush['counts'])
                assert isinstance(flush['metrics'],dict)
                assert {'drag','rebuild','rebuildQueueWait','mainRefresh','mainRefreshQueueWait'}.issubset(flush['metrics'])
                for metric in flush['metrics'].values():
                    assert metric['count']>=0 and metric['totalMs']>=0 and metric['maxMs']>=0
                completed=[]
                for row in flush['records']:
                    assert isinstance(row['key'],str) and math.isfinite(row['frequencyHz']) and math.isfinite(row['writerBeforeAwaitAt'])
                    if all(key in row for key in ('sequence','resolvedAt','writerResumedAt','resolveToResumeMs')):
                        assert isinstance(row['sequence'],int) and row['writerResumedAt']>=row['resolvedAt'] and row['resolveToResumeMs']>=0
                        completed.append(row)
                assert len(completed)>0 and flush['completedMatches']==len(completed)
            tune_lines=[line for line in lines if line.startswith('TuneUnderLoad ')]
            (root/'tune-observations.txt').write_text('\n'.join(tune_lines)+'\nFixed original viewport402x874 points. These sources are temporarily instrumented; retain original assertions and interpret this run only as causal evidence.\n')
            assert len(tune_lines)==4
            for label in ('2D','3D'):
                matched=[line for line in tune_lines if line.startswith('TuneUnderLoad '+label+' (simulator):')];assert len(matched)==1
                patterns=[r'; draws (\d+) ',r', link (\d+), skipped',r'link frames (\d+)',r'lines in (\d+)']
                counts=[int(re.search(pattern,matched[0])[1]) for pattern in patterns];assert all(count>0 for count in counts)
                report[label]={'draws_linkDraws_linkFrames_rows':counts}
            report.update(evidence='COMPLETE: four executed Tune methods and four bounded model flushes',testResult=summary.get('result'),passedMethods=summary['passedTests'],failedMethods=summary['failedTests'],device=configuration['device'],methodResults={n['nodeIdentifier']:n['result'] for n in methods})
        except (AssertionError,ValueError,TypeError,KeyError,AttributeError,StopIteration) as error:
            report['detail']=repr(error)
        (root/'classification.json').write_text(json.dumps(report,indent=2)+'\n');print(json.dumps(report,indent=2))
        RESULTS
    - name: Always upload bounded verification evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ios-writer-resume-diagnostic-${{ github.sha }}
        path: ${{ runner.temp }}/writer-resume-diagnostic/
        retention-days: 3
        if-no-files-found: error
    - name: Require complete diagnostic evidence; retain actual test failures
      if: always()
      shell: bash
      run: |
        python3 - "$RUNNER_TEMP/writer-resume-diagnostic/classification.json" <<'GATE'
        import json,sys
        assert json.load(open(sys.argv[1]))['evidence']=='COMPLETE: four executed Tune methods and four bounded model flushes'
        GATE
