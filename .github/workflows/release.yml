name: Windows audio runtime replay (no build)

on:
  workflow_dispatch:
    inputs:
      verify_only:
        description: 'Required diagnostic-only mode; no build, signing or publication'
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  actions: read

jobs:
  replay:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_only == true && github.ref == 'refs/heads/codex/windows-audio-runtime-replay' }}
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Identical declared Qt/MinGW package identities to the preserved ac9
      # CMakeCache: Qt 6.8.3, GCC 13.1.0. No product configuration/build.
      - name: Install the recorded Qt and MinGW runtime
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_mingw
          modules: 'qtmultimedia qtshadertools qtwebsockets qtserialport'
          tools: 'tools_mingw1310'
          cache: true

      # Same setup action/package family/order as ac9. Its package repository
      # floats; validate the recorded 3.6.5 header before allowing test replay.
      - name: Set up the recorded MSYS2 MINGW64 package family
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-openssl mingw-w64-x86_64-ccache

      - name: Download the preserved compiled tests (no rebuild)
        uses: actions/download-artifact@v4
        with:
          name: windows-audio-tests-pr722
          run-id: 41258145196
          github-token: ${{ github.token }}
          path: ${{ github.workspace }}

      - name: Verify exact artifact bytes and reconstruct only CTest registrations
        id: verify
        shell: pwsh
        run: |
          python scripts/ci/windows-audio-runtime-replay.py verify --root . --out runtime-evidence
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Record and validate the environment identities
        id: identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force runtime-evidence | Out-Null
          $sslRoot = '${{ steps.msys2.outputs.msys2-location }}/mingw64'
          "OPENSSL_ROOT_DIR=$sslRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $compiler = Join-Path $env:IQTA_TOOLS 'mingw1310_64/bin/c++.exe'
          $qtDll = Join-Path $env:QT_ROOT_DIR 'bin/Qt6Core.dll'
          $opensslHeader = Join-Path $sslRoot 'include/openssl/opensslv.h'
          $compilerVersion = (& $compiler -dumpfullversion | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Cannot identify recorded compiler toolchain' }
          $metadata = [ordered]@{
            diagnosticSource = (git rev-parse HEAD | Out-String).Trim()
            preservedRun = 41258145196
            preservedArtifactId = 13064574188
            compiler = $compiler
            compilerVersion = $compilerVersion
            compilerSha256 = (Get-FileHash $compiler -Algorithm SHA256).Hash
            qtRoot = $env:QT_ROOT_DIR
            qtCoreFileVersion = (Get-Item $qtDll).VersionInfo.FileVersion
            opensslRoot = $sslRoot
            originalRunnerFullPathWasNotArchived = $true
            runnerImage = $env:ImageOS
            runnerImageVersion = $env:ImageVersion
            cmake = (cmake --version | Out-String).Trim()
            ctest = (ctest --version | Out-String).Trim()
          }
          $metadata | ConvertTo-Json -Depth 5 | Tee-Object runtime-evidence/environment-identities.json
          Copy-Item $opensslHeader runtime-evidence/opensslv.h
          if ($compilerVersion -ne '13.1.0') { throw "Compiler identity drift: $compilerVersion" }
          if ((Get-Item $qtDll).VersionInfo.FileVersion -notmatch '^6\.8\.3([. ]|$)') { throw 'Qt identity drift' }
          if ((Get-Content $opensslHeader -Raw) -notmatch 'OPENSSL_VERSION_STR\s+"3\.6\.5"') { throw 'MSYS2 OpenSSL drifted from recorded 3.6.5; replay must not pretend equivalence' }

      - name: Record installed MSYS2 package revisions
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        shell: msys2 {0}
        run: |
          pacman -Q > runtime-evidence/msys2-package-versions.txt

      - name: Capture provider bytes and audit named imports against exports
        id: audit
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        continue-on-error: true
        shell: pwsh
        run: |
          # Reproduce ac9's declared Test-step PATH, not a speculative repair.
          $fftw = Join-Path $env:GITHUB_WORKSPACE 'third_party/fftw3/bin'
          $ssl = Join-Path '${{ steps.msys2.outputs.msys2-location }}/mingw64' 'bin'
          $env:OPENSSL_ROOT_DIR = '${{ steps.msys2.outputs.msys2-location }}/mingw64'
          $env:PATH = "$env:PATH;$fftw;$ssl"
          python scripts/ci/windows-audio-runtime-replay.py audit --root . --out runtime-evidence 2>&1 | Tee-Object runtime-evidence/audit-console.txt
          exit $LASTEXITCODE

      - name: Replay only the same four parent CTest entries
        id: test
        if: ${{ !cancelled() && steps.verify.outcome == 'success' && steps.identity.outcome == 'success' }}
        shell: pwsh
        run: |
          $fftw = Join-Path $env:GITHUB_WORKSPACE 'third_party/fftw3/bin'
          $ssl = Join-Path '${{ steps.msys2.outputs.msys2-location }}/mingw64' 'bin'
          $env:PATH = "$env:PATH;$fftw;$ssl"
          $selection = '^(tst_wasapi_notifier_lifetime(_native)?|tst_wasapi_policy|tst_audio_device_catalog)$'
          ctest --test-dir build -N -V -R $selection > runtime-evidence/replay-selected.txt
          ctest --test-dir build --show-only=json-v1 -R $selection > runtime-evidence/replay-selected.json
          ctest --test-dir build -V --interactive-debug-mode 0 -R $selection --output-on-failure --no-tests=error --output-junit windows-audio-replay.xml 2>&1 | Tee-Object runtime-evidence/replay-console.txt
          exit $LASTEXITCODE

      - name: Preserve all recovered evidence and matching runtime providers
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-audio-runtime-replay-${{ github.run_id }}
          path: |
            runtime-evidence/
            windows-audio-replay.xml
            build/Testing/Temporary/
            build/CMakeCache.txt
            build/CTestTestfile.cmake
            build/tests/tst_wasapi_policy.exe
            build/tests/tst_wasapi_notifier_lifetime.exe
            build/tests/tst_audio_device_catalog.exe
            build/libNereusCore.dll
            build/libNereusSDRLib.dll
            build/librade.dll
            third_party/fftw3/bin/*.dll
          retention-days: 7
          if-no-files-found: warn

      - name: An import audit failure remains a failed diagnostic
        if: ${{ !cancelled() && steps.verify.outcome == 'success' && steps.audit.outcome != 'success' }}
        shell: pwsh
        run: throw 'Runtime provider audit failed or was incomplete; inspect preserved consumer/DLL/symbol evidence before changing paths.'
