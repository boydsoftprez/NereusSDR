# Isolated bridge RED plus frozen mailbox GREEN; root-reviewed publication/runtime required.
name: CW hold isolated bridge RED verification
on:
  push:
    branches: [codex/remote-cw-hold-union]
permissions:
  contents: read
concurrency:
  group: cw-hold-bridge-red-${{ github.ref }}
  cancel-in-progress: false
jobs:
  bridge-red:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      NEREUS_DEPENDENCY_ARCHIVE_DIR: ${{ github.workspace }}/.nereus-deps
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind source and runner evidence
        env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          mkdir -p cw-bridge-red-artifacts/bridge cw-bridge-red-artifacts/mailbox
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF" = refs/heads/codex/remote-cw-hold-union
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git --no-optional-locks status --porcelain --untracked-files=no)"
          git merge-base --is-ancestor 65b5b129e913ad4a37913e561342d2cc44c41f20 HEAD
          git show -s --format='%H%n%T%n%P' HEAD > cw-bridge-red-artifacts/source-identity.txt
          printf '%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" "$GITHUB_REF" "$WORKFLOW_REF" "$WORKFLOW_SHA" > cw-bridge-red-artifacts/run-binding.txt
          git diff --name-only 65b5b129e913ad4a37913e561342d2cc44c41f20 HEAD -z | xargs -0 -r sha256sum > cw-bridge-red-artifacts/reviewed-path-hashes.txt
          uname -a > cw-bridge-red-artifacts/runner.txt
          df -k . > cw-bridge-red-artifacts/disk-start.txt
          uptime > cw-bridge-red-artifacts/load-start.txt
      - name: Restore dependency downloads
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.nereus-deps
          key: nereus-deps-${{ runner.os }}-${{ hashFiles('cmake/NereusDependencyArchives.cmake', 'cmake/FetchDependencyArchives.cmake') }}
          restore-keys: |
            nereus-deps-${{ runner.os }}-
      - name: Fetch hash-checked existing dependency pins
        run: |
          set -euo pipefail
          mirrors="$RUNNER_TEMP/nereus-git-mirrors.gitconfig"
          cmake -DNEREUS_DEPENDENCY_ARCHIVE_DIR="$NEREUS_DEPENDENCY_ARCHIVE_DIR" -DNEREUS_GIT_MIRROR_CONFIG="$mirrors" -P cmake/FetchDependencyArchives.cmake 2>&1 | tee cw-bridge-red-artifacts/dependencies.log
          git config --global --add include.path "$mirrors"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build pkg-config g++ mold ccache \
            libgl1-mesa-dev libfftw3-dev \
            libasound2-dev libjack-jackd2-dev \
            libpipewire-0.3-dev libpulse-dev \
            libssl-dev \
            python3-websockets python3-cryptography \
            gdb \
            libhamlib-utils \
            xvfb libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xkb1

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          host: linux
          target: desktop
          arch: linux_gcc_64
          # Qt 6.8+ folds qtsvg into qtbase; not listable as a module.
          modules: 'qtmultimedia qtshadertools qtwebsockets qtserialport'
          cache: true

      - name: Restore isolated CW compiler cache
        id: ccache-restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-v2-Linux-cw-hold-unit-7b302
          restore-keys: |
            ccache-v2-Linux-realtime-
      - name: Configure compiler cache
        run: |
          set -euo pipefail
          ccache --set-config=max_size=5G
          ccache --set-config=sloppiness=pch_defines,time_macros,include_file_mtime,include_file_ctime
          ccache --set-config=hash_dir=false
          ccache --set-config=compiler_check=content
          ccache --zero-stats
      - name: Configure normal Core and GUI for bridge and sender targets
        run: |
          set -euo pipefail
          cmake --version > cw-bridge-red-artifacts/tool-versions.txt
          g++ --version >> cw-bridge-red-artifacts/tool-versions.txt
          qmake -query QT_VERSION >> cw-bridge-red-artifacts/tool-versions.txt
          cp cmake/NereusDependencyArchives.cmake cw-bridge-red-artifacts/
          set +e
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            "-DCMAKE_C_FLAGS_RELWITHDEBINFO=-O2 -g1 -DNDEBUG" \
            "-DCMAKE_CXX_FLAGS_RELWITHDEBINFO=-O2 -g1 -DNDEBUG" \
            -DCMAKE_BUILD_RPATH_USE_ORIGIN=ON -DNEREUS_TEST_PYTHON=/usr/bin/python3 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_EXE_LINKER_FLAGS_INIT=-fuse-ld=mold -DCMAKE_SHARED_LINKER_FLAGS_INIT=-fuse-ld=mold \
            -DCMAKE_MODULE_LINKER_FLAGS_INIT=-fuse-ld=mold -DNEREUS_BUILD_TESTS=ON \
            -DNEREUS_TEST_SHARDS=0 -DNEREUS_TEST_SHARD=0 -DNEREUS_TESTS_OFFSCREEN=ON \
            2>&1 | tee cw-bridge-red-artifacts/configure.log
          result=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$result" > cw-bridge-red-artifacts/configure.status
          test "$result" -eq 0
          cp build/CMakeCache.txt cw-bridge-red-artifacts/
          ninja -C build -t query tests/tst_transmit_cut_line > cw-bridge-red-artifacts/bridge-target-query.txt
          ninja -C build -t commands tests/tst_transmit_cut_line > cw-bridge-red-artifacts/bridge-target-commands.txt
          ninja -C build -t query tests/tst_cwx_sender > cw-bridge-red-artifacts/target-query.txt
          ninja -C build -t commands tests/tst_cwx_sender > cw-bridge-red-artifacts/target-commands.txt
      - name: Build exact existing Core and GUI bridge and sender targets
        id: build
        run: |
          set -euo pipefail
          set +e
          nice -n 20 cmake --build build --target tst_transmit_cut_line tst_cwx_sender --parallel 2 2>&1 | tee cw-bridge-red-artifacts/build.log
          result=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$result" > cw-bridge-red-artifacts/build.status
          test "$result" -eq 0
      - name: Run exact bridge then frozen mailbox regressions serially
        run: |
          set -euo pipefail
          set +e
          ctest --test-dir build -R '^tst_transmit_cut_line$' --output-on-failure --no-tests=error --output-junit "$GITHUB_WORKSPACE/cw-bridge-red-artifacts/bridge/ctest-junit.xml" 2>&1 | tee cw-bridge-red-artifacts/bridge/ctest.log
          result=${PIPESTATUS[0]}
          printf '%s\n' "$result" > cw-bridge-red-artifacts/bridge/ctest.status
          cp build/Testing/Temporary/LastTest.log cw-bridge-red-artifacts/bridge/LastTest.log || true
          ctest --test-dir build -R '^tst_cwx_sender$' --output-on-failure --no-tests=error --output-junit "$GITHUB_WORKSPACE/cw-bridge-red-artifacts/mailbox/ctest-junit.xml" 2>&1 | tee cw-bridge-red-artifacts/mailbox/ctest.log
          result=${PIPESTATUS[0]}
          printf '%s\n' "$result" > cw-bridge-red-artifacts/mailbox/ctest.status
          cp build/Testing/Temporary/LastTest.log cw-bridge-red-artifacts/mailbox/LastTest.log || true
          set -e
      - name: Validate exact bridge RED and frozen mailbox GREEN
        id: expected-evidence-guard
        if: always()
        env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          mkdir -p cw-bridge-red-artifacts
          cat > cw-bridge-red-artifacts/bridge_mailbox_guard.py <<'PY_GUARD'
