          expected = {'schemaVersion': 1, 'status': 'SOURCE-PREDICTED ONLY; NOT EXECUTED', 'class': 'TestCwxSender', 'ctestName': 'tst_cwx_sender', 'workflowName': 'CW hold sender mailbox RED verification', 'reviewedSourceAncestor': '24283c1a9b3ab16f8bd641efb4941c128cd84788', 'expectedRef': 'refs/heads/codex/remote-cw-hold-union', 'workflowPath': '.github/workflows/cw-hold-red.yml', 'approvedSourcePatchSHA256': 'f1c9fe72ec750ff055e5e343ecdf58f1353726c6357f94061802001e5cc6f5eb', 'originalTestSourceSHA256': '59b20de44806952626eb16e1eae5dfdd1a6f06e9c0f2b70b0727d806a2799056', 'proposedTestSourceSHA256': 'bb770fddabd4315da50f24181c497ad9451ca7acd453b81309e141e524e6d962', 'reviewedSourceHashes': {'src/core/safety/RemoteCwSafetyState.h': 'b04cd686caab3f308bb44976c681c20c1ddf0a00ab70b2c689b5589c5c509c22', 'src/core/safety/RemoteCwSafetyState.cpp': 'af03e8d247b85c503385d0029a9abde7fa7b328a1543ae45e4c6fbfb85fd758a', 'docs/architecture/2026-10-27-remote-cw-hold-plan.md': '8221cce294141d0455dd0eb9b7d7d2548ca5c056ceca5965daec407d1b065670', 'CMakeLists.txt': '0277e9f5224e372d2bf9a159fd49cfc07785372acd2d1d38c0df2c930de27ff1', 'tests/CMakeLists.txt': '1c8a84a0f618d6ccdbc191a071fb892d20ec6366996680fe0e3efc0404b01223', 'cmake/NereusDependencyArchives.cmake': '3cf622e8a482ff8942c94af6db53e1f4e713d9fa6d69ed9e233fd1397f1c76b3', 'cmake/FetchDependencyArchives.cmake': '28a62b0f7271c3a508b9df93e1a82a1de2bb1f9773bbec113182030ae9fec084', 'src/core/CwxSender.h': 'e2ddb944eaf181af9f93cbef0e610970fcf40ac24b2168e4435e84d7f720ed90', 'src/core/CwxSender.cpp': '94414a37f8f9836bf4bb7dfabc5b32d4d030d1e4436a68994e5a0e79ab8820e6', 'tests/tst_cwx_sender.cpp': 'bb770fddabd4315da50f24181c497ad9451ca7acd453b81309e141e524e6d962'}, 'allowedChangedPathsFromAncestor': ['.github/workflows/cw-hold-red.yml', 'src/core/CwxSender.cpp', 'src/core/CwxSender.h', 'tests/tst_cwx_sender.cpp'], 'expectedCounts': {'total': 52, 'passed': 42, 'failed': 10, 'skipped': 0, 'blacklisted': 0, 'independentPublicationFailures': 6, 