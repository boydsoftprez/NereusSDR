# Focused mailbox RED diagnostic; root-reviewed publication/runtime required.
name: CW hold sender mailbox RED verification
on:
  push:
    branches: [codex/remote-cw-hold-union]
permissions:
  contents: read
concurrency:
  group: cw-hold-mailbox-red-${{ github.ref }}
  cancel-in-progress: false
jobs:
  sender-mailbox-red:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      NEREUS_DEPENDENCY_ARCHIVE_DIR: ${{ github.workspace }}/.nereus-deps
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind source and runner evidence
        env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          mkdir -p cw-mailbox-red-artifacts
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF" = refs/heads/codex/remote-cw-hold-union
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git --no-optional-locks status --porcelain --untracked-files=no)"
          git merge-base --is-ancestor 24283c1a9b3ab16f8bd641efb4941c128cd84788 HEAD
          git show -s --format='%H%n%T%n%P' HEAD > cw-mailbox-red-artifacts/source-identity.txt
          printf '%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" "$GITHUB_REF" "$WORKFLOW_REF" "$WORKFLOW_SHA" > cw-mailbox-red-artifacts/run-binding.txt
          git diff --name-only 24283c1a9b3ab16f8bd641efb4941c128cd84788 HEAD -z | xargs -0 -r sha256sum > cw-mailbox-red-artifacts/reviewed-path-hashes.txt
          uname -a > cw-mailbox-red-artifacts/runner.txt
          df -k . > cw-mailbox-red-artifacts/disk-start.txt
          uptime > cw-mailbox-red-artifacts/load-start.txt
      - name: Restore dependency downloads
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.nereus-deps
          key: nereus-deps-${{ runner.os }}-${{ hashFiles('cmake/NereusDependencyArchives.cmake', 'cmake/FetchDependencyArchives.cmake') }}
          restore-keys: |
            nereus-deps-${{ runner.os }}-
      - name: Fetch hash-checked existing dependency pins
        run: |
          set -euo pipefail
          mirrors="$RUNNER_TEMP/nereus-git-mirrors.gitconfig"
          cmake -DNEREUS_DEPENDENCY_ARCHIVE_DIR="$NEREUS_DEPENDENCY_ARCHIVE_DIR" -DNEREUS_GIT_MIRROR_CONFIG="$mirrors" -P cmake/FetchDependencyArchives.cmake 2>&1 | tee cw-mailbox-red-artifacts/dependencies.log
          git config --global --add include.path "$mirrors"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build pkg-config g++ mold ccache \
            libgl1-mesa-dev libfftw3-dev \
            libasound2-dev libjack-jackd2-dev \
            libpipewire-0.3-dev libpulse-dev \
            libssl-dev \
            python3-websockets python3-cryptography \
            gdb \
            libhamlib-utils \
            xvfb libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xkb1

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          host: linux
          target: desktop
          arch: linux_gcc_64
          # Qt 6.8+ folds qtsvg into qtbase; not listable as a module.
          modules: 'qtmultimedia qtshadertools qtwebsockets qtserialport'
          cache: true

      - name: Restore compiler cache without saving verification results
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-v2-Linux-cw-mailbox-red-${{ github.sha }}
          restore-keys: |
            ccache-v2-Linux-realtime-
      - name: Configure compiler cache
        run: |
          set -euo pipefail
          ccache --set-config=max_size=5G
          ccache --set-config=sloppiness=pch_defines,time_macros,include_file_mtime,include_file_ctime
          ccache --set-config=hash_dir=false
          ccache --set-config=compiler_check=content
          ccache --zero-stats
      - name: Configure normal Core and GUI for the focused sender target
        run: |
          set -euo pipefail
          cmake --version > cw-mailbox-red-artifacts/tool-versions.txt
          g++ --version >> cw-mailbox-red-artifacts/tool-versions.txt
          qmake -query QT_VERSION >> cw-mailbox-red-artifacts/tool-versions.txt
          cp cmake/NereusDependencyArchives.cmake cw-mailbox-red-artifacts/
          set +e
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            "-DCMAKE_C_FLAGS_RELWITHDEBINFO=-O2 -g1 -DNDEBUG" \
            "-DCMAKE_CXX_FLAGS_RELWITHDEBINFO=-O2 -g1 -DNDEBUG" \
            -DCMAKE_BUILD_RPATH_USE_ORIGIN=ON -DNEREUS_TEST_PYTHON=/usr/bin/python3 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_EXE_LINKER_FLAGS_INIT=-fuse-ld=mold -DCMAKE_SHARED_LINKER_FLAGS_INIT=-fuse-ld=mold \
            -DCMAKE_MODULE_LINKER_FLAGS_INIT=-fuse-ld=mold -DNEREUS_BUILD_TESTS=ON \
            -DNEREUS_TEST_SHARDS=0 -DNEREUS_TEST_SHARD=0 -DNEREUS_TESTS_OFFSCREEN=ON \
            2>&1 | tee cw-mailbox-red-artifacts/configure.log
          result=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$result" > cw-mailbox-red-artifacts/configure.status
          test "$result" -eq 0
          cp build/CMakeCache.txt cw-mailbox-red-artifacts/
          ninja -C build -t query tests/tst_cwx_sender > cw-mailbox-red-artifacts/target-query.txt
          ninja -C build -t commands tests/tst_cwx_sender > cw-mailbox-red-artifacts/target-commands.txt
      - name: Build exact existing Core and GUI sender target
        run: |
          set -euo pipefail
          set +e
          nice -n 20 cmake --build build --target tst_cwx_sender --parallel 2 2>&1 | tee cw-mailbox-red-artifacts/build.log
          result=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$result" > cw-mailbox-red-artifacts/build.status
          test "$result" -eq 0
      - name: Run exact sender mailbox baseline
        run: |
          set -euo pipefail
          set +e
          ctest --test-dir build -R '^tst_cwx_sender$' --output-on-failure --no-tests=error --output-junit "$GITHUB_WORKSPACE/cw-mailbox-red-artifacts/ctest-junit.xml" 2>&1 | tee cw-mailbox-red-artifacts/ctest.log
          result=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$result" > cw-mailbox-red-artifacts/ctest.status
          # Preserve actual Qt records BEFORE guard; missing log is rejected.
          cp build/Testing/Temporary/LastTest.log cw-mailbox-red-artifacts/LastTest.log || true
      - name: Validate source-bound mailbox publication RED evidence
        if: always()
        env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          mkdir -p cw-mailbox-red-artifacts
          cat > cw-mailbox-red-artifacts/red_guard.py <<'PY_GUARD'
