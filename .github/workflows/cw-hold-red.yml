              need(re.findall(r"^\d+/\d+ Test:\s*(\S+)\s*$", text, re.M) == [spec["ctestName"]], label + " wrong copied LastTest")
              need(text.count("Start testing of " + spec["class"]) == 1 and text.count("Finished testing of " + spec["class"]) == 1, label + " incomplete/duplicate Qt run")
              pattern = r"^(PASS|FAIL!)\s*:\s*" + re.escape(spec["class"]) + r"::([A-Za-z0-9_]+)\(([^)]*)\)([^\n]*)$"
              entries = list(re.finditer(pattern, text, re.M))
              need(len(entries) == spec["expectedCounts"]["total"], label + " missing/extra Qt record")
              need(len(re.findall(r"^(?:PASS|FAIL!)\s*:.*$", text, re.M)) == len(entries), label + " foreign/malformed Qt record")
              result = []
              for index, entry in enumerate(entries):
                  kind, function, row, detail = entry.groups()
                  case = function + ("(" + row + ")" if row else "")
                  wanted = spec["expectedRecordsInOrder"][index]
                  need(case == wanted["case"] and kind == wanted["result"], label + " wrong/duplicate/missing case/result: " + case)
                  block = text[entry.end():entries[index + 1].start() if index + 1 < len(entries) else len(text)]
                  locs = re.findall(r"Loc:\s*\[([^\]]+)\]", block)
                  item = {"case": case, "result": kind, "classification": wanted["classification"]}
                  if kind == "FAIL!":
                      first = wanted["firstFailure"]
                      need(len(locs) == 1, label + " missing/duplicate FIRST location: " + case)
                      loc = re.fullmatch(r"(.+?)[/\\]" + re.escape(pathlib.Path(first["file"]).name) + r"\((\d+)\)", locs[0])
                      need(loc is not None and pathlib.Path(loc.group(1)).resolve() == pathlib.Path("tests").resolve(), label + " foreign failure file")
                      need(int(loc.group(2)) == first["line"], label + " wrong FIRST assertion: " + case)
                      if first["kind"] == "QVERIFY":
                          need("'" + first["expression"] + "' returned FALSE" in detail, label + " wrong QVERIFY expression: " + case)
                      else:
                          need("Compared values are not the same" in detail, label + " wrong comparison kind")
                          need(re.search(r"Actual\s+\(" + re.escape(first["actualExpression"]) + r"\)\s*:\s*" + re.escape(first["actualValue"]) + r"\s*(?:\n|$)", block), label + " wrong recovery actual")
                          need(re.search(r"Expected\s+\(" + re.escape(first["expectedExpression"]) + r"\)\s*:\s*" + re.escape(first["expectedValue"]) + r"\s*(?:\n|$)", block), label + " wrong recovery expected")
                      item["location"] = locs[0]
                  else:
                      need(not locs, label + " assertion under PASS")
                  result.append(item)
              count = spec["expectedCounts"]
              need(len(re.findall(r"Loc:\s*\[", text)) == count["failed"], label + " unassociated location")
              need(re.findall(r"Totals:\s+(\d+) passed, (\d+) failed, (\d+) skipped, (\d+) blacklisted", text) == [(str(count["passed"]), str(count["failed"]), "0", "0")], label + " wrong totals")
              completion = "Failed" if count["failed"] else "Passed"
              need(len(re.findall(r"^Test " + completion + r"\.", text, re.M)) == 1, label + " missing CTest completion")
              return {"records": result, "counts": count, "rawSHA256": {name: digest(folder / name) for name in ("LastTest.log", "ctest.log", "ctest-junit.xml")}}
          try:
              env = os.environ
              need(env["GITHUB_EVENT_NAME"] == "push" and env["GITHUB_REF"] == expected["expectedRef"], "wrong event/ref")
              need(env["GITHUB_WORKFLOW"] == expected["workflowName"] and env["RUNNER_OS"] == "Linux", "wrong workflow/runner")
              need(re.fullmatch(r"[0-9a-f]{40}", env["GITHUB_SHA"]) and env["GITHUB_RUN_ID"].isdigit() and int(env["GITHUB_RUN_ATTEMPT"]) > 0, "invalid source/run")
              need(env["WORKFLOW_REF"] == env["GITHUB_REPOSITORY"] + "/" + expected["workflowPath"] + "@" + expected["expectedRef"], "wrong workflowref")
              need(env["WORKFLOW_SHA"] == env["GITHUB_SHA"] == git("rev-parse", "HEAD"), "wrong source/workflow SHA")
              need(not git("status", "--porcelain", "--untracked-files=no"), "tracked source dirt")
              subprocess.run(["git", "--no-optional-locks", "merge-base", "--is-ancestor", expected["reviewedSourceAncestor"], "HEAD"], check=True)
              need(sorted(git("diff", "--name-only", expected["reviewedSourceAncestor"], "HEAD").splitlines()) == expected["allowedChangedPathsFromAncestor"], "wrong seven-path delta")
              need((out / "source-identity.txt").read_text().strip() == git("show", "-s", "--format=%H%n%T%n%P", "HEAD"), "source receipt mismatch")
              need((out / "run-binding.txt").read_text().splitlines() == [env[k] for k in ("GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT", "GITHUB_SHA", "GITHUB_REF", "WORKFLOW_REF", "WORKFLOW_SHA")], "run receipt mismatch")
              actual = {path: digest(path) for path in expected["reviewedSourceHashes"]}
              need(actual == expected["reviewedSourceHashes"], "wrong reviewed source bytes")
              for phase in ("configure", "build"):
                  need((out / (phase + ".status")).read_text().strip() == "0", phase + " failed/missing")
              cache = (out / "CMakeCache.txt").read_text()
              for key, value in {"ENABLE_DFNR":"ON","ENABLE_WDSP":"ON","NEREUS_USE_PCH":"ON","NEREUS_BUILD_TESTS":"ON","NEREUS_TESTS_OFFSCREEN":"ON","NEREUS_TEST_SHARDS":"0","NEREUS_TEST_SHARD":"0","CMAKE_BUILD_TYPE":"RelWithDebInfo"}.items():
                  need(re.search(r"^" + re.escape(key) + r":[^=\n]+=" + re.escape(value) + "$", cache, re.M), "wrong normal configuration " + key)
              need(re.search(r"^6\.8\.\d+\s*$", (out / "tool-versions.txt").read_text(), re.M), "wrong Qt6.8")
              for label, spec in expected["suites"].items():
                  lines = pathlib.Path(spec["testSourcePath"]).read_text().splitlines()
                  for record in spec["expectedRecordsInOrder"]:
                      if record["firstFailure"]:
                          first = record["firstFailure"]
                          need(lines[first["line"] - 1].strip() == first["assertion"], "wrong frozen assertion source")
                  observed[label] = suite(label, spec)
              verdict.update(acceptedIsolatedBridgeRed=True, mailbox52Green=True, sourceSHA=env["GITHUB_SHA"], sourceTree=git("rev-parse","HEAD^{tree}"), runId=env["GITHUB_RUN_ID"], runAttempt=env["GITHUB_RUN_ATTEMPT"], counts={k:v["counts"] for k,v in observed.items()}, reviewedSourceHashes=actual, guardSHA256=digest(__file__), workflowSHA256=digest(expected["workflowPath"]))
          except Exception as error:
              verdict["rejection"] = str(error)
          (out / "suite-records.json").write_text(json.dumps(observed, indent=2) + "\n")
          (out / "bridge-mailbox-verdict.json").write_text(json.dumps(verdict, indent=2) + "\n")
          print(json.dumps(verdict, indent=2))
          sys.exit(0 if verdict["acceptedIsolatedBridgeRed"] and verdict["mailbox52Green"] else 1)
          PY_GUARD
          python3 cw-bridge-red-artifacts/bridge_mailbox_guard.py
      - name: Save isolated CW compiler cache after expected evidence passes
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.expected-evidence-guard.outcome == 'success' && steps.ccache-restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ${{ steps.ccache-restore.outputs.cache-primary-key }}
      - name: Capture final diagnostics
        if: always()
        run: |
          mkdir -p cw-bridge-red-artifacts
          df -k . > cw-bridge-red-artifacts/disk-end.txt
          uptime > cw-bridge-red-artifacts/load-end.txt
          ccache -s > cw-bridge-red-artifacts/ccache-final.txt 2>&1 || true
          cp build/CMakeCache.txt cw-bridge-red-artifacts/ 2>/dev/null || true
          cp build/Testing/Temporary/LastTest.log cw-bridge-red-artifacts/ 2>/dev/null || true
          cp build/Testing/Temporary/LastTestsFailed.log cw-bridge-red-artifacts/ 2>/dev/null || true
      - name: Upload isolated bridge RED and mailbox GREEN evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cw-bridge-red-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: cw-bridge-red-artifacts/
          retention-days: 7
          if-no-files-found: error
