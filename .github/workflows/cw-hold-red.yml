ification': 'original-regression', 'firstFailure': None}, {'case': 'hl2InOff_heldKeyNeedsMoxAndReleasesBothBitsWithIt', 'result': 'PASS', 'classification': 'original-regression', 'firstFailure': None}, {'case': 'nonHl2NeverSetsThePtt', 'result': 'PASS', 'classification': 'original-regression', 'firstFailure': None}, {'case': 'inOffCwxKeysOnlyWhileMoxIsHeld', 'result': 'PASS', 'classification': 'original-regression', 'firstFailure': None}, {'case': 'gateWordsRefuseEverySendAndTheKey', 'result': 'PASS', 'classification': 'original-regression', 'firstFailure': None}, {'case': 'nothingToSendIsRefusedWithWords', 'result': 'PASS', 'classification': 'original-regression', 'firstFailure': None}, {'case': 'swappingTheLineReleasesTheOldOneAndAborts', 'result': 'PASS', 'classification': 'original-regression', 'firstFailure': None}, {'case': 'testAt30KeysEachEdgeWithinTwoMs', 'result': 'PASS', 'classification': 'original-regression', 'firstFailure': None}, {'case': 'modelRefusesOutsideCw', 'result': 'PASS', 'classification': 'original-regression', 'firstFailure': None}, {'case': 'modelRefusesWithTheKeyerGatesWords', 'result': 'PASS', 'classification': 'original-regression', 'firstFailure': None}, {'case': 'modelGateTurningFalseMidMessageAborts', 'result': 'PASS', 'classification': 'original-regression', 'firstFailure': None}, {'case': 'modelLeavingCwAborts', 'result': 'PASS', 'classification': 'original-regression', 'firstFailure': None}, {'case': 'modelTeardownReleasesTheLineAndLetsGo', 'result': 'PASS', 'classification': 'original-regression', 'firstFailure': None}, {'case': 'modelConnectionSwapReleasesTheOldLine', 'result': 'PASS', 'classification': 'original-regression', 'firstFailure': None}, {'case': 'modelCutMidMessageThenClearKeysNothing', 'result': 'PASS', 'classification': 'original-regression', 'firstFailure': None}, {'case': 'modelStopAllTxInOffWithoutMox_clearsLogicalSendQuietly', 'result': 'PASS', 'classification': 'original-regression', 'firstFailure': None}, {'case': 'modelStopAllTxInOffWithoutMox_clearsPostMessageHangQuietly', 'result': 'PASS', 'classification': 'original-regression', 'firstFailure': None}, {'case': 'modelStopAllTxInOffWithMox_announcesAndClearsSender', 'result': 'PASS', 'classification': 'original-regression', 'firstFailure': None}, {'case': 'modelStopAllTxInQsk_announcesAndClearsSender', 'result': 'PASS', 'classification': 'original-regression', 'firstFailure': None}, {'case': 'modelStopAllTxStopsCwx', 'result': 'PASS', 'classification': 'original-regression', 'firstFailure': None}, {'case': 'cleanupTestCase', 'result': 'PASS', 'classification': 'original-regression', 'firstFailure': None}], 'scope': 'six independent mailbox-publication RED candidates only; four dependent prerequisite failures are NOT consumption/race RED; no worker-loop/content-identity/bridge/physical/Task3A-complete acceptance'}
