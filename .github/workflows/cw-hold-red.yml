# Focused positive verification; root-reviewed publication/runtime required.
name: CW hold pure-value GREEN verification
on:
  push:
    branches: [codex/remote-cw-hold-union]
permissions:
  contents: read
concurrency:
  group: cw-hold-pure-green-${{ github.ref }}
  cancel-in-progress: false
jobs:
  pure-value-green:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      NEREUS_DEPENDENCY_ARCHIVE_DIR: ${{ github.workspace }}/.nereus-deps
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind source and runner evidence
        env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          mkdir -p cw-green-artifacts
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF" = refs/heads/codex/remote-cw-hold-union
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          git merge-base --is-ancestor 8a334c2a55b7d09f024767c710706ac7e01cc841 HEAD
          git show -s --format='%H%n%T%n%P' HEAD > cw-green-artifacts/source-identity.txt
          printf '%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" "$GITHUB_REF" "$WORKFLOW_REF" "$WORKFLOW_SHA" > cw-green-artifacts/run-binding.txt
          git diff --name-only 8a334c2a55b7d09f024767c710706ac7e01cc841 HEAD -z | xargs -0 -r sha256sum > cw-green-artifacts/reviewed-path-hashes.txt
          uname -a > cw-green-artifacts/runner.txt
          df -k . > cw-green-artifacts/disk-start.txt
          uptime > cw-green-artifacts/load-start.txt
      - name: Restore dependency downloads
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.nereus-deps
          key: nereus-deps-${{ runner.os }}-${{ hashFiles('cmake/NereusDependencyArchives.cmake', 'cmake/FetchDependencyArchives.cmake') }}
          restore-keys: |
            nereus-deps-${{ runner.os }}-
      - name: Fetch hash-checked existing dependency pins
        run: |
          set -euo pipefail
          mirrors="$RUNNER_TEMP/nereus-git-mirrors.gitconfig"
          cmake -DNEREUS_DEPENDENCY_ARCHIVE_DIR="$NEREUS_DEPENDENCY_ARCHIVE_DIR" -DNEREUS_GIT_MIRROR_CONFIG="$mirrors" -P cmake/FetchDependencyArchives.cmake 2>&1 | tee cw-green-artifacts/dependencies.log
          git config --global --add include.path "$mirrors"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build pkg-config g++ mold ccache \
            libgl1-mesa-dev libfftw3-dev \
            libasound2-dev libjack-jackd2-dev \
            libpipewire-0.3-dev libpulse-dev \
            libssl-dev \
            python3-websockets python3-cryptography \
            gdb \
            libhamlib-utils \
            xvfb libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xkb1

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          host: linux
          target: desktop
          arch: linux_gcc_64
          # Qt 6.8+ folds qtsvg into qtbase; not listable as a module.
          modules: 'qtmultimedia qtshadertools qtwebsockets qtserialport'
          cache: true

      - name: Restore compiler cache without saving verification results
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-v2-Linux-cw-pure-red-${{ github.sha }}
          restore-keys: |
            ccache-v2-Linux-realtime-
      - name: Configure compiler cache
        run: |
          set -euo pipefail
          ccache --set-config=max_size=5G
          ccache --set-config=sloppiness=pch_defines,time_macros,include_file_mtime,include_file_ctime
          ccache --set-config=hash_dir=false
          ccache --set-config=compiler_check=content
          ccache --zero-stats
      - name: Configure normal core with only focused test build requested
        run: |
          set -euo pipefail
          cmake --version > cw-green-artifacts/tool-versions.txt
          g++ --version >> cw-green-artifacts/tool-versions.txt
          qmake -query QT_VERSION >> cw-green-artifacts/tool-versions.txt
          cp cmake/NereusDependencyArchives.cmake cw-green-artifacts/
          set +e
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            "-DCMAKE_C_FLAGS_RELWITHDEBINFO=-O2 -g1 -DNDEBUG" \
            "-DCMAKE_CXX_FLAGS_RELWITHDEBINFO=-O2 -g1 -DNDEBUG" \
            -DCMAKE_BUILD_RPATH_USE_ORIGIN=ON -DNEREUS_TEST_PYTHON=/usr/bin/python3 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_EXE_LINKER_FLAGS_INIT=-fuse-ld=mold -DCMAKE_SHARED_LINKER_FLAGS_INIT=-fuse-ld=mold \
            -DCMAKE_MODULE_LINKER_FLAGS_INIT=-fuse-ld=mold -DNEREUS_BUILD_TESTS=ON \
            -DNEREUS_TEST_SHARDS=0 -DNEREUS_TEST_SHARD=0 -DNEREUS_TESTS_OFFSCREEN=ON \
            2>&1 | tee cw-green-artifacts/configure.log
          result=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$result" > cw-green-artifacts/configure.status
          test "$result" -eq 0
          cp build/CMakeCache.txt cw-green-artifacts/
          ninja -C build -t query tests/tst_remote_cw_safety > cw-green-artifacts/target-query.txt
          ninja -C build -t commands tests/tst_remote_cw_safety > cw-green-artifacts/target-commands.txt
      - name: Build exact pure value target
        run: |
          set -euo pipefail
          set +e
          nice -n 20 cmake --build build --target tst_remote_cw_safety --parallel 2 2>&1 | tee cw-green-artifacts/build.log
          result=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$result" > cw-green-artifacts/build.status
          test "$result" -eq 0
      - name: Verify all pure-value cases pass
        run: |
          set -euo pipefail
          set +e
          ctest --test-dir build -R '^tst_remote_cw_safety$' --output-on-failure --no-tests=error --output-junit "$GITHUB_WORKSPACE/cw-green-artifacts/ctest-junit.xml" 2>&1 | tee cw-green-artifacts/ctest.log
          result=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$result" > cw-green-artifacts/ctest.status
          cp build/Testing/Temporary/LastTest.log cw-green-artifacts/LastTest.log
          python3 - <<'PY_GUARD'
          import collections, hashlib, json, pathlib, re, sys, xml.etree.ElementTree as ET
          out = pathlib.Path("cw-green-artifacts")
          expected = {'class': 'TestRemoteCwSafetyState', 'ctestName': 'tst_remote_cw_safety', 'testSourceSha256': 'd44b0624e4e5d3233efdd39207f9054a7a0e76d2881b1aeec0b4f5bdc8fa915f', 'expectedPassingQtCases': ['initTestCase', 'noActivityRejectsAllMutations', 'zeroEpochCannotCreateActivity', 'beginRecordsLiveUnheldEpoch', 'independentReasons(clear-link)', 'independentReasons(clear-mic)', 'independentReasons(clear-guard)', 'oldEpochCannotHoldOrRelease', 'invalidationBlocksRecoveryUntilFinish', 'physicalPressOnlyInvalidatesNetworkHold(no-hold)', 'physicalPressOnlyInvalidatesNetworkHold(mic-only)', 'physicalPressOnlyInvalidatesNetworkHold(link)', 'physicalPressOnlyInvalidatesNetworkHold(guard)', 'physicalPressOnlyInvalidatesNetworkHold(mic-and-link)', 'physicalObservationBeforeRecoveryPreventsRelease', 'recoveryBeforePhysicalObservationAddsNoTakeover', 'remainingNetworkReasonStillAllowsTakeover', 'finishedOldEpochCannotClearNew', 'currentFinishClearsInvalidatedEpoch', 'concurrentPhysicalAndRecoveryHaveOnlyLegalOutcomes', 'cleanupTestCase'], 'expectedCounts': {'passed': 21, 'failed': 0, 'skipped': 0}, 'status': 'POSITIVE VERIFICATION CONTRACT; NOT EXECUTED', 'scope': 'pure safety value only; no bridge/sender/guard/physical/phone acceptance'}
          (out / "expected-behavioral-green.json").write_text(json.dumps(expected, indent=2) + "\n")
          verdict = {"acceptedPureValueGreen": False, "scope": expected["scope"]}
          try:
              actual_test_sha = hashlib.sha256(pathlib.Path("tests/tst_remote_cw_safety.cpp").read_bytes()).hexdigest()
              assert actual_test_sha == expected["testSourceSha256"], "unexpected frozen test source hash"
              for phase in ("configure", "build", "ctest"):
                  assert (out / (phase + ".status")).read_text().strip() == "0", phase + " failed or missing"
              root = ET.parse(out / "ctest-junit.xml").getroot()
              cases = list(root.iter("testcase"))
              assert len(cases) == 1 and cases[0].attrib.get("name") == expected["ctestName"], "wrong/absent test selection"
              for tag in ("failure", "error", "skipped"):
                  assert not list(root.iter(tag)), "JUnit " + tag
              # CTest suppresses passing Qt output on stdout. Its actual LastTest.log
              # is copied BEFORE this guard; do not manufacture PASS from quiet output.
              text = (out / "LastTest.log").read_text()
              assert re.search(r"Test:\s+" + re.escape(expected["ctestName"]), text), "wrong LastTest log"
              assert not re.search(r"FAIL!|QFATAL|Received signal|Segmentation fault|Subprocess aborted|\*\*\*Timeout|Not Run|XFAIL|XPASS|SKIP\s*:", text, re.I), "failure/skip/non-assertion termination"
              pattern = r"^PASS\s*:\s*" + re.escape(expected["class"]) + r"::([A-Za-z0-9_]+)\(([^)]*)\)"
              entries = re.findall(pattern, text, flags=re.M)
              actual_pass = [name + ("(" + row + ")" if row else "") for name, row in entries]
              assert collections.Counter(actual_pass) == collections.Counter(expected["expectedPassingQtCases"]), "missing/extra Qt case or data row"
              assert re.search(r"Totals:\s+21 passed, 0 failed, 0 skipped", text), "wrong/incomplete Qt totals"
              assert re.search(r"Test Passed\.", text), "CTest did not record passing execution"
              verdict.update(acceptedPureValueGreen=True, actualPassingQtCases=actual_pass, frozenTestSha256=actual_test_sha)
          except Exception as error:
              verdict["rejection"] = str(error)
          (out / "green-guard-verdict.json").write_text(json.dumps(verdict, indent=2) + "\n")
          print(json.dumps(verdict, indent=2))
          sys.exit(0 if verdict["acceptedPureValueGreen"] else 1)
          PY_GUARD
      - name: Capture final diagnostics
        if: always()
        run: |
          mkdir -p cw-green-artifacts
          df -k . > cw-green-artifacts/disk-end.txt
          uptime > cw-green-artifacts/load-end.txt
          ccache -s > cw-green-artifacts/ccache-final.txt 2>&1 || true
          cp build/CMakeCache.txt cw-green-artifacts/ 2>/dev/null || true
          cp build/Testing/Temporary/LastTest.log cw-green-artifacts/ 2>/dev/null || true
          cp build/Testing/Temporary/LastTestsFailed.log cw-green-artifacts/ 2>/dev/null || true
      - name: Upload focused GREEN evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cw-pure-green-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: cw-green-artifacts/
          retention-days: 7
          if-no-files-found: error
