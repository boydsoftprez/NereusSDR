                  actual = {"case": case, "result": kind, "classification": wanted["classification"]}
                  if kind == "FAIL!":
                      require("Compared values are not the same" in detail, "unexpected assertion kind: " + case)
                      require(len(locations) == 1, "missing/duplicate assertion location: " + case)
                      loc = re.fullmatch(r"(.+?)[/\\]tst_cwx_sender\.cpp\((\d+)\)", locations[0])
                      require(loc is not None, "wrong assertion file: " + case)
                      require(pathlib.Path(loc.group(1)).resolve() == pathlib.Path("tests").resolve(), "foreign assertion path: " + case)
                      require(int(loc.group(2)) == wanted["firstFailure"]["line"], "wrong FIRST assertion line: " + case)
                      actual["location"] = locations[0]
                  else:
                      require(not locations, "assertion under passing case: " + case)
                  observed.append(actual)
              require(len(re.findall(r"Loc:\s*\[", text)) == expected["expectedCounts"]["failed"], "unassociated assertion location")
              totals = re.findall(r"Totals:\s+(\d+) passed, (\d+) failed, (\d+) skipped, (\d+) blacklisted", text)
              require(totals == [("42", "10", "0", "0")], "wrong/incomplete totals")
              require(len(re.findall(r"^Test Failed\.", text, re.M)) == 1, "missing/wrong CTest failed completion")
              verdict.update(acceptedMailboxPublicationRed=True, sourceSHA=env["GITHUB_SHA"], sourceTree=git("rev-parse", "HEAD^{tree}"),
                             runId=env["GITHUB_RUN_ID"], runAttempt=env["GITHUB_RUN_ATTEMPT"], reviewedSourceHashes=actual_hashes,
                             workflowSHA256=digest(expected["workflowPath"]), guardSHA256=digest(__file__),
                             independentPublicationFailures=[r["case"] for r in observed if r["classification"] == "independent-publication-red"],
                             dependentPrerequisiteFailures=[r["case"] for r in observed if r["classification"] == "dependent-publication-prerequisite-failure"],
                             originalPassing=40, localNegativePassing=2, counts=expected["expectedCounts"],
                             rawEvidenceSHA256={name: digest(out / name) for name in ("LastTest.log", "ctest.log", "ctest-junit.xml")})
          except Exception as error:
              verdict["rejection"] = str(error)
          (out / "qt-records.json").write_text(json.dumps(observed, indent=2) + "\n")
          (out / "red-guard-verdict.json").write_text(json.dumps(verdict, indent=2) + "\n")
          print(json.dumps(verdict, indent=2))
          sys.exit(0 if verdict["acceptedMailboxPublicationRed"] else 1)
          PY_GUARD
          python3 cw-mailbox-red-artifacts/red_guard.py
      - name: Capture final diagnostics
        if: always()
        run: |
          mkdir -p cw-mailbox-red-artifacts
          df -k . > cw-mailbox-red-artifacts/disk-end.txt
          uptime > cw-mailbox-red-artifacts/load-end.txt
          ccache -s > cw-mailbox-red-artifacts/ccache-final.txt 2>&1 || true
          cp build/CMakeCache.txt cw-mailbox-red-artifacts/ 2>/dev/null || true
          cp build/Testing/Temporary/LastTest.log cw-mailbox-red-artifacts/ 2>/dev/null || true
          cp build/Testing/Temporary/LastTestsFailed.log cw-mailbox-red-artifacts/ 2>/dev/null || true
      - name: Upload focused mailbox RED evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cw-mailbox-red-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: cw-mailbox-red-artifacts/
          retention-days: 7
          if-no-files-found: error
