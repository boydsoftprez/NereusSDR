name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Run by hand from the Actions tab; the traversal harness runs only then.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------------------
  # Compliance + provenance + license attribution.
  #
  # Split out of the per-platform build matrix on 2026-05-13 (Linux CI
  # speed-alignment epic). Previously every Linux compliance script ran
  # serially in front of the slow 33-minute Linux build; that pushed
  # Linux's wall-clock to ~44m vs ~11m on macOS and ~13m on Windows.
  # Running compliance as a sibling job in parallel removes ~5 minutes
  # from the Linux build's critical path. Both jobs remain required
  # checks, so a compliance failure still blocks the PR.
  # --------------------------------------------------------------------
  compliance:
    runs-on: ubuntu-24.04
    name: Compliance & Provenance
    steps:
      - uses: actions/checkout@v4

      - name: Verify Thetis license headers
        run: python3 scripts/verify-thetis-headers.py

      - name: Check for un-attributed new ports (PR diff scan)
        # Reverse-attribution check: scans added/modified C/C++ files in
        # the PR diff for Thetis-style markers (callsigns, upstream
        # filenames, cls*/uc*/frm* class patterns) and fails if any look
        # like a port but aren't in PROVENANCE.md or marked as opt-out.
        # Closes the gap left by verify-thetis-headers.py, which only
        # checks files already registered in PROVENANCE.
        if: github.event_name == 'pull_request'
        env:
          CHECK_NEW_PORTS_BASE_REF: origin/${{ github.base_ref }}
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=100
          python3 scripts/check-new-ports.py

      - name: Check for un-attributed ports (full-tree sweep)
        # Complements the diff scan above by sweeping every src/**/*.{cpp,h}
        # against the union of THETIS-PROVENANCE, WDSP-PROVENANCE, and
        # aethersdr-reconciliation. Catches historical gap cases — files
        # that were committed before the diff heuristic existed and
        # slipped through without attribution. Extends the heuristic to
        # AetherSDR tells (KK7GWY, "Ported from AetherSDR" comments,
        # AetherSDR filenames adjacent to the "AetherSDR" marker).
        env:
          CHECK_NEW_PORTS_FULL: "1"
        run: python3 scripts/check-new-ports.py

      # ------------------------------------------------------------------
      # Phase 2/3 compliance auditors (added 2026-04-18, Plan Task 15)
      # ------------------------------------------------------------------
      - name: Verify AetherSDR + WDSP license-header markers
        # Extends the Thetis-kind header check above to the two other
        # lineage kinds (AetherSDR Bucket A + WDSP vendored sources).
        # Fails if a Bucket A file is missing the project-level
        # AetherSDR attribution, or if a WDSP source lost its upstream
        # GPL permission block on re-import.
        run: python3 scripts/verify-thetis-headers.py --all-kinds

      - name: Verify provenance tables match the source tree
        # Already enforced in pre-commit Ring 2. Re-run in CI Ring 3
        # because squashed merges and rebases can introduce drift the
        # hook never saw.
        run: python3 scripts/verify-provenance-sync.py

      - name: Every shipped library has its licence text
        # R-R3-50. Fails when a third_party/ directory or a FetchContent /
        # ExternalProject name in the CMake files has no row in
        # packaging/third-party-licenses/README.md, when a row's text is
        # missing from that folder, or when a text there is named by no row.
        run: python3 scripts/check-third-party-licenses.py

      - name: Verify inline '// From Thetis' cite version stamps
        # Regression gate: fails if the count of unstamped cites
        # exceeds the grandfathered baseline in
        # tests/compliance/inline-cites-baseline.json (288 as of
        # 2026-04-18 sweep). --strict will replace this once the
        # baseline has been remediated to zero.
        run: python3 scripts/verify-inline-cites.py

      - name: Compliance inventory — no missing required markers
        # Walks every git-tracked file, classifies by upstream lineage,
        # verifies per-kind header markers. Fails on any missing marker.
        run: python3 scripts/compliance-inventory.py --fail-on-unclassified

      - name: iOS app provenance (ios/ stays NereusSDR-original)
        # R-IOS-29. The app ships under GPLv3 plus an App Store permission
        # that upstream authors have not granted, so ios/ must carry no
        # upstream code or text. Checks every app source's two header
        # lines, bans upstream names and Copyright (C) lines, checks each
        # ios/THIRD-PARTY.md row's licence and archive SHA-256, and keeps
        # the conformance fixtures out of everything but the tests.
        run: python3 scripts/verify-ios-provenance.py

      - name: GUI must not reach into WdspEngine for an RX channel
        # Phase 3F Sub-Epic J Task 11. Not an attribution check, but the
        # same shape (whole-tree sweep, no upstream clone needed) so it
        # runs here rather than in the build matrix. The per-slice
        # pipeline is SliceModel property -> RadioModel push ->
        # rxChannel(slice->sliceIndex()); a direct rxChannel() call from
        # src/gui/ bypasses that and, historically, hardcoded channel 0
        # (how ANF on slice B ended up toggling slice A).
        run: python3 scripts/verify-no-gui-dsp-access.py

      - name: No captured-slice spectrum wiring
        # Same shape as the check above, one layer up. connect() binds the
        # object, so a slice control wired through activeSpectrumWidget() is
        # pan-0 forever, and the lambdas on the other end used to capture
        # RadioModel::activeSlice() by value -- Slice A, permanently. That is
        # the 2026-07-28 bench defect where click-to-tune always retuned
        # flag A whatever the operator selected.
        run: python3 scripts/verify-no-captured-slice-spectrum-wiring.py

      - name: Every test property names a test that exists
        # PR #327's first run: all four Linux shards failed to configure.
        # nereus_add_test() registers a test in one shard of four, so a
        # set_tests_properties() after it must sit inside if(TEST <name>).
        # Parses tests/CMakeLists.txt; no build, no configure.
        run: python3 scripts/verify-test-registration.py

      - name: No image-drawn cursor shapes
        # Qt 6.11.0 on macOS draws SizeAllCursor / WaitCursor / BusyCursor
        # from ICC-tagged PNGs and QImage::toCGImage() frees the colour
        # space before CGImageCreate uses it: the 2026-09-25 / 09-26 desktop
        # crashes from the container title bar. Native shapes only.
        run: python3 scripts/verify-no-image-cursors.py

      # ------------------------------------------------------------------
      # Inline author-tag preservation (added 2026-04-21 after DH1KLM drop)
      # ------------------------------------------------------------------
      - name: Cache pinned Thetis + mi0bot-Thetis upstream checkouts
        # Both upstreams are pinned to fixed SHAs (ramdor 501e3f5,
        # mi0bot c26a8a4) so the cache key never invalidates until we
        # re-pin upstream — bump the trailing -vN if the pinned SHAs
        # change. Saves ~90 seconds per run vs a fresh full clone.
        id: thetis-cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/../Thetis
            ${{ github.workspace }}/../Thetis-v2.10.3.15
            ${{ github.workspace }}/../mi0bot-Thetis
            ${{ github.workspace }}/../freedv-gui
          key: thetis-clones-501e3f5-3759d09-c26a8a4-77e793a-v3

      - name: Clone Thetis + mi0bot-Thetis upstream (cache miss only)
        if: steps.thetis-cache.outputs.cache-hit != 'true'
        # Both upstreams are pinned to the exact commit our inline cites
        # were verified against. Without these pins, HEAD drift shifts
        # line numbers out from under our cites and the hook flags
        # phantom missing tags that live at the NEW line of an unrelated
        # edit.
        #
        # ramdor/Thetis pinned to 501e3f5 (tag v2.10.3.13, "Archive
        # project and end active development") to match every
        # `[v2.10.3.13]` inline cite stamp.
        # See PR #120 CI failure 2026-04-23 for the original incident.
        #
        # ramdor/Thetis ALSO cloned at 3759d09 (tag v2.10.3.15, "g2e") into
        # ../Thetis-v2.10.3.15, because one pin cannot serve two stamps.
        # The ANAN-G2E SKU port and Phase 3F both cite v2.10.3.15, and
        # upstream inserted a `case HPSDRModel.ANAN_G2E: //N1GP` between
        # the two releases, shifting console.cs by 8 lines. Checked against
        # the .13 pin, a correct .15 cite lands on unrelated code and the
        # verifier demands the author tags sitting there: four such phantom
        # FAILs blocked PR #293 on 2026-07-31, each naming a real
        # contributor (//G8NJJ, //DH1KLM) and each entirely spurious.
        # verify-inline-tag-preservation.py routes by the cite's own stamp
        # (THETIS_VERSION_DIRS); this is the checkout it routes to.
        #
        # mi0bot/OpenHPSDR-Thetis pinned to c26a8a4 ("Updated for
        # release", 2026-04-01) to match every `[@c26a8a4]` inline cite
        # stamp in the HL2 IO board epic.
        # See main CI failure 2026-04-25 (post PR #137) for the
        # incident that motivated this pin: mi0bot HEAD inserted a new
        # ANAN_G1 case at setup.cs:20238 carrying a `//N1GP` tag,
        # making the verifier flag four phantom missing tags on the
        # untouched HermesLite cite block we ported from c26a8a4.
        #
        # drowe67/freedv-gui pinned to 77e793a to match every
        # `[@77e793a]` inline cite stamp from Phase 3J-2 + 3R. Added
        # 2026-07-28: the ~20 `// From freedv-gui <path>` cites in
        # FreeDVReporterClient / PskReporterClient matched no detector
        # in verify-inline-tag-preservation.py, so they were never
        # counted and never verified. With the detector added, they need
        # a clone here or they only ever report upstream-not-found.
        #
        # Shallow fetch + checkout of the pinned SHA avoids cloning the
        # full git history. GitHub's git server allows `fetch --depth=1
        # <sha>` because uploadpack.allowReachableSHA1InWant is enabled.
        run: |
          mkdir -p ../Thetis
          git -C ../Thetis init -q
          git -C ../Thetis remote add origin https://github.com/ramdor/Thetis.git
          git -C ../Thetis fetch --depth=1 -q origin 501e3f513f73f07742d7e1b85a0e9528bd14977d
          git -C ../Thetis checkout -q FETCH_HEAD
          mkdir -p ../Thetis-v2.10.3.15
          git -C ../Thetis-v2.10.3.15 init -q
          git -C ../Thetis-v2.10.3.15 remote add origin https://github.com/ramdor/Thetis.git
          git -C ../Thetis-v2.10.3.15 fetch --depth=1 -q origin 3759d096067b7574550b963c1e7a22003da2ab00
          git -C ../Thetis-v2.10.3.15 checkout -q FETCH_HEAD
          mkdir -p ../mi0bot-Thetis
          git -C ../mi0bot-Thetis init -q
          git -C ../mi0bot-Thetis remote add origin https://github.com/mi0bot/OpenHPSDR-Thetis.git
          git -C ../mi0bot-Thetis fetch --depth=1 -q origin c26a8a4c7592605039be5f4b5973b33e04e91e54
          git -C ../mi0bot-Thetis checkout -q FETCH_HEAD
          mkdir -p ../freedv-gui
          git -C ../freedv-gui init -q
          git -C ../freedv-gui remote add origin https://github.com/drowe67/freedv-gui.git
          git -C ../freedv-gui fetch --depth=1 -q origin 77e793a37e0ecf6cfa99b7cf21a410fd154e9d94
          git -C ../freedv-gui checkout -q FETCH_HEAD

      - name: Corpus drift — upstream author tags match committed corpus
        # Fails if upstream Thetis (ramdor or mi0bot fork) contains
        # contributor tags that the committed
        # docs/attribution/thetis-author-tags.json does not yet list.
        # Forces corpus refresh before any port can cite a new region.
        env:
          NEREUS_THETIS_DIR: ${{ github.workspace }}/../Thetis
          NEREUS_MI0BOT_DIR: ${{ github.workspace }}/../mi0bot-Thetis
        run: python3 scripts/discover-thetis-author-tags.py --drift

      - name: Verify inline author-tag preservation in ported code
        # For every `// From Thetis X:N [@sha]` cite, opens upstream at
        # line N and requires any author tag in ±5 source lines to
        # appear within ±10 port lines. This is the safety net that
        # would have caught the 2026-04-21 DH1KLM drop at PR time.
        env:
          NEREUS_THETIS_DIR: ${{ github.workspace }}/../Thetis
          NEREUS_MI0BOT_DIR: ${{ github.workspace }}/../mi0bot-Thetis
          NEREUS_FREEDV_DIR: ${{ github.workspace }}/../freedv-gui
        run: python3 scripts/verify-inline-tag-preservation.py

      - name: Contributor indexes are up to date with corpus
        # Regenerates docs/attribution/thetis-{contributor,inline-mods}-
        # index.md from the corpus JSON and fails the PR if the
        # committed indexes drift. Ensures the two human-readable
        # audit docs stay in lockstep with the mechanical corpus, and
        # by extension with upstream Thetis source.
        env:
          NEREUS_THETIS_DIR: ${{ github.workspace }}/../Thetis
          NEREUS_MI0BOT_DIR: ${{ github.workspace }}/../mi0bot-Thetis
        run: python3 scripts/generate-contributor-indexes.py --check

      - name: Station link document tables match surface.json
        # iPhone app plan Task 2 (R-IOS-01). The tables in
        # docs/architecture/2026-09-23-station-link-v1.md are rendered from
        # tests/data/link/v1/surface.json, which tst_link_surface_manifest
        # captures from the code. Fails when the document is out of date;
        # regenerate with python3 scripts/render-link-tables.py.
        run: python3 scripts/render-link-tables.py --check

      - name: WDSP header census drift detector
        # Re-runs the third_party/wdsp/src/ classification and fails if
        # the counts drift from WDSP-PROVENANCE.md's documented split
        # (128 gpl2-or-later + 10 utility no-header). Catches a WDSP
        # re-sync that forgets to update PROVENANCE.
        run: python3 scripts/audit-wdsp-headers.py

      - name: Set up Python for pytest
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pytest
        run: python3 -m pip install --upgrade pip pytest

      - name: pytest — compliance test suite
        # Runs tests/compliance/ (inventory schema + cite baseline).
        run: python3 -m pytest tests/compliance/ -v

      - name: "pytest: release version rules"
        run: python3 -m pytest tests/release/ -v

  # --------------------------------------------------------------------
  # The rendezvous service (rendezvous/, iPhone app plan Task 26).
  #
  # Runs the service's pytest suite, conformance vectors included, on the
  # same packages the server runs: Ubuntu 24.04's python3-websockets,
  # python3-cryptography and python3-pytest from apt, never pip, under the
  # system interpreter (no setup-python, whose interpreter would not see
  # the apt packages).
  # --------------------------------------------------------------------
  rendezvous:
    runs-on: ubuntu-24.04
    name: Rendezvous service
    steps:
      - uses: actions/checkout@v4

      - name: Install the service's packages from apt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-websockets python3-cryptography python3-pytest

      - name: Show the versions under test
        run: /usr/bin/python3 -c "import sys, websockets, cryptography, pytest; print(sys.version.split()[0], websockets.__version__, cryptography.__version__, pytest.__version__)"

      - name: pytest (rendezvous service and conformance vectors)
        run: /usr/bin/python3 -m pytest rendezvous/tests -q -p no:cacheprovider

  # --------------------------------------------------------------------
  # The traversal harness (iPhone app plan Task 27, R-IOS-16).
  #
  # Reaching a Core through the rendezvous across real NATs, on this runner
  # only: Linux network namespaces and nftables (endpoint-independent and
  # port-randomising NATs, UDP blocked, large datagrams dropped, an
  # IPv6-only client behind NAT64 and DNS64 with a CLAT, netem loss), with
  # the rendezvous service and coturn started inside it and every secret
  # made at run time. It builds only the peer tool and runs the opt-in
  # ctest label `traversal` as root. It never reaches the live server.
  #
  # It builds all of NereusCore (RADE included), so it runs only when the
  # workflow is started by hand (workflow_dispatch), not on every push or
  # pull request.
  # --------------------------------------------------------------------
  traversal:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    name: Traversal harness
    env:
      NEREUS_DEPENDENCY_ARCHIVE_DIR: ${{ github.workspace }}/.nereus-deps
    steps:
      - uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # Dependency downloads (cmake/NereusDependencyArchives.cmake)
      # ------------------------------------------------------------------
      # Every source archive and git repository the configure and build
      # download, fetched up front into NEREUS_DEPENDENCY_ARCHIVE_DIR and
      # cached across runs. CI run 36866003880 lost two Linux jobs to a
      # GitHub 504 on the libsodium and Opus archives, which CMake does not
      # retry (it retries connection errors only, never an HTTP error).
      # cmake/FetchDependencyArchives.cmake retries each download with
      # waits between attempts, keeps an archive only when its SHA-256
      # matches the pin and a git mirror only when its pinned ref resolves
      # to the pinned commit, and writes url.insteadOf redirects for the
      # verified mirrors. The configure then uses each local copy in place
      # of its upstream URL and still checks URL_HASH on it. On a cache hit no
      # dependency download reaches the network at all. The cache is saved
      # straight after the fetch, so a later build failure still keeps it.
      - name: Restore dependency downloads
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.nereus-deps
          key: nereus-deps-${{ runner.os }}-${{ hashFiles('cmake/NereusDependencyArchives.cmake', 'cmake/FetchDependencyArchives.cmake') }}
          restore-keys: |
            nereus-deps-${{ runner.os }}-

      - name: Fetch dependency downloads
        shell: bash
        run: |
          # pwd -W gives Git Bash's D:/ form on Windows; elsewhere it fails
          # and plain pwd is used.
          mirrors="$(cd "$RUNNER_TEMP" && (pwd -W 2>/dev/null || pwd))/nereus-git-mirrors.gitconfig"
          cmake -DNEREUS_DEPENDENCY_ARCHIVE_DIR="$NEREUS_DEPENDENCY_ARCHIVE_DIR" \
                -DNEREUS_GIT_MIRROR_CONFIG="$mirrors" \
                -P cmake/FetchDependencyArchives.cmake
          git config --global --add include.path "$mirrors"

      - name: Save dependency downloads
        if: steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.nereus-deps
          key: ${{ steps.deps-cache.outputs.cache-primary-key }}

      - name: Install build and harness packages from apt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build pkg-config g++ mold \
            libgl1-mesa-dev libfftw3-dev libasound2-dev libjack-jackd2-dev \
            libpipewire-0.3-dev libssl-dev \
            autoconf automake libtool wget \
            python3-websockets python3-cryptography \
            iproute2 nftables coturn socat openssl unbound tayga
          # The packaged services must not run on the runner itself; the
          # harness starts its own copies inside namespaces.
          sudo systemctl stop coturn unbound 2>/dev/null || true

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: 'qtmultimedia qtshadertools qtwebsockets'
          cache: true

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_EXE_LINKER_FLAGS_INIT=-fuse-ld=mold \
            -DCMAKE_SHARED_LINKER_FLAGS_INIT=-fuse-ld=mold \
            -DNEREUS_BUILD_TESTS=ON \
            -DNEREUS_TEST_PYTHON=/usr/bin/python3 \
            -DNEREUS_TRAVERSAL_TESTS=ON

      - name: Build the peer tool
        run: cmake --build build --target nereus_rendezvous_peer -j$(nproc)

      - name: Run the harness (ctest -L traversal, as root)
        run: sudo -E env "PATH=$PATH" "LD_LIBRARY_PATH=${LD_LIBRARY_PATH:-}" ctest --test-dir build -L traversal --output-on-failure

  # --------------------------------------------------------------------
  # Per-platform build + C++ test gate.
  #
  # Linux is the source-of-truth gate for the C++ test suite (see the
  # Configure (Linux) and Test step comments below for the reasoning).
  # macOS + Windows still build the main app and configure with tests
  # OFF because the test fakes are Linux/Qt-specific.
  # --------------------------------------------------------------------
  build:
    strategy:
      fail-fast: false
      matrix:
        # Linux is sharded into 4 parallel runners (shard 0..3) so the
        # 451-test build splits ~113 tests per runner. Each shard
        # independently builds the main app + its slice of tests + runs
        # them. Wall-clock to all-green matches macOS / Windows because
        # all four shards run concurrently.
        #
        # macOS + Windows stay single-job: they don't build the test
        # suite (the fakes are Linux-specific) so a single runner is
        # already at parity with each Linux shard.
        #
        # `shard` / `shards` only apply on Linux entries; macOS / Windows
        # leave them unset so CMake's NEREUS_TEST_SHARDS defaults to 0
        # (no sharding) — but they don't build tests anyway, so the
        # variable is moot for them.
        include:
          - os: ubuntu-24.04
            name: Linux x64 (1/4)
            shard: 0
            shards: 4
          - os: ubuntu-24.04
            name: Linux x64 (2/4)
            shard: 1
            shards: 4
          - os: ubuntu-24.04
            name: Linux x64 (3/4)
            shard: 2
            shards: 4
          - os: ubuntu-24.04
            name: Linux x64 (4/4)
            shard: 3
            shards: 4
          - os: macos-15
            name: macOS Apple Silicon
          - os: windows-latest
            name: Windows x64

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.name }})

    env:
      # Pin ccache's cache directory under the workspace so it matches
      # the cache action's `path:` on every platform.  ccache 4.x's
      # XDG-based default (~/.cache/ccache on Linux, ~/Library/Caches
      # /ccache on macOS) didn't match the action's `path: ~/.ccache`,
      # silently breaking cache save with "Path Validation Error" since
      # the ubuntu-24.04 / Homebrew ccache 4.x runner rollout.  Using
      # ${{ github.workspace }}/.ccache makes the path platform-uniform
      # and trivially valid for the cache action.  No-op on Windows
      # (sccache path; this env var is only consumed by ccache).
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      # Pre-fetched, hash-checked dependency archives; see "Fetch
      # dependency downloads" below. Every configure in the job reads it.
      NEREUS_DEPENDENCY_ARCHIVE_DIR: ${{ github.workspace }}/.nereus-deps

    steps:
      - uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # Dependency downloads (cmake/NereusDependencyArchives.cmake)
      # ------------------------------------------------------------------
      # Every source archive and git repository the configure and build
      # download, fetched up front into NEREUS_DEPENDENCY_ARCHIVE_DIR and
      # cached across runs. CI run 36866003880 lost two Linux jobs to a
      # GitHub 504 on the libsodium and Opus archives, which CMake does not
      # retry (it retries connection errors only, never an HTTP error).
      # cmake/FetchDependencyArchives.cmake retries each download with
      # waits between attempts, keeps an archive only when its SHA-256
      # matches the pin and a git mirror only when its pinned ref resolves
      # to the pinned commit, and writes url.insteadOf redirects for the
      # verified mirrors. The configure then uses each local copy in place
      # of its upstream URL and still checks URL_HASH on it. On a cache hit no
      # dependency download reaches the network at all. The cache is saved
      # straight after the fetch, so a later build failure still keeps it;
      # one job per OS saves (Linux shard 0), the others only restore.
      - name: Restore dependency downloads
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.nereus-deps
          key: nereus-deps-${{ runner.os }}-${{ hashFiles('cmake/NereusDependencyArchives.cmake', 'cmake/FetchDependencyArchives.cmake') }}
          restore-keys: |
            nereus-deps-${{ runner.os }}-

      - name: Fetch dependency downloads
        shell: bash
        run: |
          # pwd -W gives Git Bash's D:/ form on Windows; elsewhere it fails
          # and plain pwd is used.
          mirrors="$(cd "$RUNNER_TEMP" && (pwd -W 2>/dev/null || pwd))/nereus-git-mirrors.gitconfig"
          cmake -DNEREUS_DEPENDENCY_ARCHIVE_DIR="$NEREUS_DEPENDENCY_ARCHIVE_DIR" \
                -DNEREUS_GIT_MIRROR_CONFIG="$mirrors" \
                -P cmake/FetchDependencyArchives.cmake
          git config --global --add include.path "$mirrors"

      - name: Save dependency downloads
        if: steps.deps-cache.outputs.cache-hit != 'true' && (matrix.shard == 0 || matrix.shard == '')
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.nereus-deps
          key: ${{ steps.deps-cache.outputs.cache-primary-key }}

      # ------------------------------------------------------------------
      # Linux dependencies
      # ------------------------------------------------------------------
      - name: Install system dependencies (Linux)
        # System libs only. Qt itself comes from install-qt-action below
        # so we match the release.yml + Windows CI versions (6.8.*) and
        # get QRhiWidget on Linux too. Apt qt6-* on ubuntu-24.04 was Qt
        # 6.4.2, which is too old for QRhiWidget and forced
        # -DNEREUS_GPU_SPECTRUM=OFF on Linux.
        #
        # python3-websockets and python3-cryptography: tst_rendezvous_client
        # runs the rendezvous service (rendezvous/server) on the runner, as
        # the rendezvous job does (iPhone app plan Task 27). They belong to
        # /usr/bin/python3, which Configure (Linux) names as
        # NEREUS_TEST_PYTHON: a PATH lookup would find setup-python's
        # toolcache interpreter (from install-qt-action), which lacks them.
        #
        # mold (the apt mold package) is the fast linker. With 451 test
        # executables linking against NereusSDRLib + Qt6 the default
        # ld linker dominated Linux build time at ~33 minutes. The
        # Configure (Linux) step below selects mold via -fuse-ld=mold.
        #
        # gdb: QtTest's watchdog uses it to print every thread's stack when
        # a test function hangs (QTEST_FUNCTION_TIMEOUT in the test step).
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build pkg-config g++ mold \
            libgl1-mesa-dev libfftw3-dev \
            libasound2-dev libjack-jackd2-dev \
            libpipewire-0.3-dev \
            libssl-dev \
            python3-websockets python3-cryptography \
            gdb \
            xvfb libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xkb1

      # Free up disk space on the Linux runner. ubuntu-24.04 ships with
      # ~75 GB total, but ~25 GB is consumed by pre-installed Android
      # SDK / .NET / GHC / unused hosted-tool-cache entries.  Phase
      # 3J-1 closeout pushed the total link-time on-disk footprint
      # past the remaining free budget: 451 test executables each
      # linking against NereusSDRLib (~700 MB stripped, much larger
      # with debug info) plus the vendored RADE neural-codec tree.
      # Run #25835957362 died mid-link with "No space left on
      # device" and the log blob got truncated before upload finished.
      #
      # Removes the canonical no-cost paths from the actions/runner-
      # images known-issue:
      #   https://github.com/actions/runner-images/issues/2840
      # ~25 GB recovered, verified by `df -h` in the action output.
      - name: Free up disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "── Before cleanup ──"
          df -h /
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /opt/hostedtoolcache/PyPy
          sudo rm -rf /opt/hostedtoolcache/Ruby
          sudo rm -rf /opt/hostedtoolcache/go
          sudo docker image prune --all --force 2>/dev/null || true
          echo "── After cleanup ──"
          df -h /

      - name: Install Qt (Linux)
        if: runner.os == 'Linux'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          host: linux
          target: desktop
          arch: linux_gcc_64
          # Qt 6.8+ folds qtsvg into qtbase; not listable as a module.
          modules: 'qtmultimedia qtshadertools qtwebsockets'
          cache: true

      # ------------------------------------------------------------------
      # macOS dependencies
      # ------------------------------------------------------------------
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          # autoconf/automake/libtool/wget are required by third_party/rade
          # vendored Opus (autotools chain + wget-based DRED model download
          # in opus/autogen.sh). Not installed by default on macOS runners.
          # openssl@3 named explicitly (fix round 4 cheap out-of-scope
          # item): find_package(OpenSSL) is now REQUIRED, and this row was
          # relying on openssl@3 arriving transitively rather than
          # declaring the dependency this build actually has, the same
          # way fftw already is declared.
          brew install qt@6 ninja fftw openssl@3 autoconf automake libtool wget

      # ------------------------------------------------------------------
      # Windows dependencies
      # ------------------------------------------------------------------
      - name: Install Qt (Windows)
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          host: windows
          target: desktop
          arch: win64_mingw
          modules: 'qtmultimedia qtshadertools qtwebsockets'
          tools: 'tools_mingw1310'
          cache: true

      # Fix round 3, Important A (coordinator + reviewer): a prior
      # revision of this route used Qt's aqt tool tools_openssl_x64,
      # which the reviewer found does not exist under that name -- the
      # real package is tools_opensslv3_x64 / qt.tools.opensslv3.win_x64
      # -- and even correctly named would have been the wrong ABI
      # regardless: that Qt-distributed package is an MSVC 2019 prebuild
      # (openssl_3.0.16_prebuild_x64.7z), and this leg's Qt is MinGW-built
      # (arch: win64_mingw above). Replaced entirely rather than patched:
      # the toolchain-matched route for a MinGW target is MSYS2's own
      # package repository, not a Qt-distributed tool at all.
      #
      # MINGW64, not UCRT64: verified 2026-08-08 that win64_mingw /
      # tools_mingw1310 (GCC 13.1.0) is Qt's classic MSVCRT-based MinGW
      # build. Fix round 4 correction: the immediately preceding revision
      # of this comment supported that claim by citing a "separate
      # win64_mingw_ucrt architecture" -- that name does not exist and
      # was never checked against Qt's real architecture list before
      # being written down. Verified this round via aqtinstall's own
      # docs: Qt's Windows desktop architectures are win64_mingw,
      # win64_llvm_mingw, win64_msvc2022_64 and
      # win64_msvc2022_arm64_cross_compiled -- no "_ucrt" suffix anywhere.
      # win64_llvm_mingw (a DIFFERENT toolchain, LLVM-based, not GCC) is
      # Qt's actual UCRT MinGW option; win64_mingw (this leg's
      # architecture, GCC-based) remains the classic MSVCRT one.
      # Recorded here because the ORIGINAL conclusion (this leg needs the
      # MSVCRT-matching MINGW64 environment, not UCRT64) was correct both
      # times; only the supporting citation was fabricated, which is
      # worse than an honest "unverified" because it reads as checked.
      # MSYS2's own documentation is still the real, separately-verified
      # basis for treating MSVCRT/UCRT as unsafe to mix.
      # mingw-w64-x86_64-openssl is the MINGW64-environment package;
      # mingw-w64-ucrt-x86_64-openssl (a different package, UCRT64
      # environment) would be the wrong runtime here.
      #
      # msys2/setup-msys2 (not the MSYS2 already preinstalled at
      # C:\msys64 on windows-latest) because MSYS2's own CI documentation
      # recommends the action over the preinstalled copy, and the
      # preinstalled one updates on a rolling ~10-day cycle. Fix round 4
      # correction: an earlier revision of this comment additionally
      # framed the action as giving REPRODUCIBILITY comparable to the
      # vcpkg baseline pin on the MSVC leg -- that overstated it. `update:
      # true` below still runs a full `pacman -Syuu`, and `install:` names
      # no package version, so the OpenSSL version this step resolves to
      # can still float run to run; there is no MSYS2 baseline-pin
      # equivalent of vcpkg's manifest mode in use here. What
      # msys2/setup-msys2 actually gives over the preinstalled copy is a
      # controlled, action-maintained setup path, not reproducibility.
      # Checked (not just assumed) whether adding an explicit `cache:
      # true` below would help: the action's own action.yml defaults
      # `cache` to `true` already, so this step already has it and an
      # explicit line would be a no-op -- nothing to add there.
      #
      # `id: msys2` captures the action's `msys2-location` output
      # (documented since v2.24.1) so the discovery step below does not
      # have to assume install-qt-action's `dir` default the way the
      # removed aqt-search step did.
      - name: Set up MSYS2 MINGW64 with OpenSSL (Windows)
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-openssl

      # Fix round 2 assertions kept exactly as they were (reviewer judged
      # them correct): a directory existing is not proof it is usable.
      # Kept here in fix round 3 because the underlying risk is unchanged
      # by swapping the acquisition route -- MSYS2 packaging could still
      # in principle ship a runtime-only OpenSSL, so this still asserts a
      # real header AND a real link library exist, not merely that
      # mingw-w64-x86_64-openssl reported success, and fails the job
      # loudly rather than letting a not-REQUIRED-guarded leg configure
      # quietly without TLS.
      - name: Locate MSYS2 OpenSSL (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # msys2-location has NO trailing separator (verified 2026-08-08
          # against the action's own main.js: it is built with Node's
          # path.join(), which never appends one) -- a bare concatenation
          # without the "/" here would silently produce
          # "...msys64mingw64" instead of "...msys64/mingw64".
          ARCH_DIR="${{ steps.msys2.outputs.msys2-location }}/mingw64"

          # Header check: openssl/evp.h specifically, because that is one
          # of the headers CertificateStore.cpp itself includes -- proof
          # this exact dependency is satisfiable, not just that SOME
          # OpenSSL-shaped tree exists.
          if [ ! -f "$ARCH_DIR/include/openssl/evp.h" ]; then
            echo "::error::$ARCH_DIR has no include/openssl/evp.h -- mingw-w64-x86_64-openssl may not have installed, or MSYS2's MINGW64 layout changed."
            exit 1
          fi

          # Link library check: matches ANY plausible libcrypto import/
          # static library under lib/ or lib64/ rather than assuming one
          # exact filename, since packaging naming can vary. -print -quit
          # (not `| head -n1`, fix round 4 minor): this whole script runs
          # under `set -eo pipefail` (see the shell's own default for
          # `run:` steps), and a `find ... | head -n1` pipeline can exit
          # 141 (SIGPIPE) if find is still writing a second match when
          # head closes the pipe after its first line -- bash's pipefail
          # reports that as the pipeline's own failure even though head
          # itself succeeded. find's own -quit action stops the search
          # after the first match with no pipe involved, so there is
          # nothing for a downstream reader to close early. Verified
          # locally: `find <dir> ... -print -quit` returns the same
          # single result `| head -n1` did, with two candidate files
          # present, exit 0.
          CRYPTO_LIB=$(find "$ARCH_DIR" \( -path '*/lib/*' -o -path '*/lib64/*' \) -iname '*crypto*' \( -iname '*.a' -o -iname '*.lib' \) -print -quit 2>/dev/null)
          if [ -z "$CRYPTO_LIB" ]; then
            echo "::error::$ARCH_DIR has headers but no libcrypto import/static library under lib/ or lib64/ (searched for *crypto*.a / *crypto*.lib). CertificateStore cannot link against this without one."
            exit 1
          fi

          echo "Found MSYS2 MINGW64 OpenSSL at: $ARCH_DIR"
          echo "  headers: $ARCH_DIR/include/openssl/evp.h"
          echo "  link library: $CRYPTO_LIB"
          echo "OPENSSL_ROOT_DIR=$ARCH_DIR" >> "$GITHUB_ENV"

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja -y

      - name: Download FFTW3 (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # The zip comes from the dependency downloads fetched above,
          # already checked against its pinned SHA-256.
          mkdir -p third_party/fftw3/{include,lib,bin}
          cp .nereus-deps/fftw-3.3.5-dll64.zip /tmp/fftw3.zip
          cd /tmp && unzip -o fftw3.zip -d fftw3
          cp /tmp/fftw3/fftw3.h $GITHUB_WORKSPACE/third_party/fftw3/include/
          cp /tmp/fftw3/libfftw3-3.dll $GITHUB_WORKSPACE/third_party/fftw3/bin/
          cp /tmp/fftw3/libfftw3-3.def $GITHUB_WORKSPACE/third_party/fftw3/lib/

      # ------------------------------------------------------------------
      # Compiler cache (ccache for Linux/macOS, sccache for Windows)
      # ------------------------------------------------------------------
      - name: Install ccache (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y ccache

      - name: Install ccache (macOS)
        if: runner.os == 'macOS'
        run: brew install ccache

      - name: Restore ccache
        if: runner.os != 'Windows'
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          # Per-shard cache key on Linux so the 4 parallel shards don't
          # race on the same write key (only one save per key wins per
          # run).  matrix.shard is empty on macOS, so the key collapses
          # to the original `ccache-macOS-<sha>` form there.  Restore
          # falls through: shard-specific → any-shard-this-OS → any
          # prior cache for this OS.
          key: ccache-${{ runner.os }}-shard${{ matrix.shard }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-shard${{ matrix.shard }}-
            ccache-${{ runner.os }}-

      - name: Configure ccache
        if: runner.os != 'Windows'
        # sloppiness=pch_defines,time_macros,include_file_mtime,include_file_ctime
        # is required so PCH'd compilations are cacheable. Without it, ccache
        # bypasses any TU compiled with -include-pch (treats them as
        # "no_input_file"). hash_dir=false improves cross-runner cache reuse
        # by removing the absolute path from the hash inputs.  max-size at
        # 500M per shard so 4 Linux shards × 500M stays well under the
        # 10 GB repo cache pool ceiling (with codeql + Qt install caches
        # also competing for space).
        run: |
          ccache --max-size=500M
          ccache --set-config=sloppiness=pch_defines,time_macros,include_file_mtime,include_file_ctime
          ccache --set-config=hash_dir=false
          ccache --zero-stats

      # Windows intentionally skips sccache. The GitHub Actions Cache backend
      # (Azure Blob) had a multi-hour outage during Phase 3N shakedown that
      # caused sccache startup to fail hard ("Server startup failed: cache
      # storage failed to read: <h2>Our services aren't available right now</h2>"),
      # and sccache has no graceful fallback. 'sccache --show-stats' is not a
      # reliable probe because it queries a freshly started empty server that
      # hasn't touched the backend yet. Qt install is already cached via
      # install-qt-action's cache: true, which is the dominant cost anyway.

      # ------------------------------------------------------------------
      # Configure
      # ------------------------------------------------------------------
      - name: Configure (Linux)
        if: runner.os == 'Linux'
        # 2026-05-12 (PR #238 review P1 #4): NEREUS_BUILD_TESTS=ON
        # so the test suite actually compiles + runs in CI.  Prior
        # configure left it off, the ctest step ran with
        # --no-tests=ignore, and any drift in test sources (signal
        # signatures, ctor sigs, factory-profile defaults) silently
        # passed.  Now we build + run the whole test suite on Linux.
        #
        # 2026-05-13: Qt now comes from install-qt-action (6.8.*)
        # instead of apt qt6-* (which was 6.4.2 on ubuntu-24.04).
        # That makes QRhiWidget available on Linux CI so we no
        # longer need -DNEREUS_GPU_SPECTRUM=OFF.  Matches release.yml
        # x86_64 path and Windows CI.
        #
        # 2026-05-13 (Linux CI speed-alignment): -fuse-ld=mold replaces
        # the default ld linker on the EXE/SHARED/MODULE link lines.
        # mold is roughly 5x faster than ld on highly-parallel link
        # graphs; with 451 test executables this saves the bulk of the
        # build wall-clock. _INIT suffix means it composes with any
        # toolchain-provided defaults instead of clobbering them.
        #
        # 2026-05-13 (sharding): NEREUS_TEST_SHARDS / NEREUS_TEST_SHARD
        # tell tests/CMakeLists.txt's nereus_add_test() to register
        # only the slice of tests whose name-MD5 modulo SHARDS matches
        # SHARD.  See tests/CMakeLists.txt for the dispatch rules.
        #
        # 2026-09-30 (INFRA-C1): NEREUS_TEST_PYTHON=/usr/bin/python3, the
        # interpreter the apt python3-websockets and python3-cryptography
        # above belong to. install-qt-action runs setup-python, which puts
        # a toolcache Python without them first on PATH; the rendezvous
        # test helpers start on this absolute path instead.
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DNEREUS_TEST_PYTHON=/usr/bin/python3 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_EXE_LINKER_FLAGS_INIT=-fuse-ld=mold \
            -DCMAKE_SHARED_LINKER_FLAGS_INIT=-fuse-ld=mold \
            -DCMAKE_MODULE_LINKER_FLAGS_INIT=-fuse-ld=mold \
            -DNEREUS_BUILD_TESTS=ON \
            -DNEREUS_TEST_SHARDS=${{ matrix.shards }} \
            -DNEREUS_TEST_SHARD=${{ matrix.shard }}

      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_PREFIX_PATH="$(brew --prefix)" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # -DNEREUS_GPU_SPECTRUM=ON is explicit so CMake's FATAL_ERROR
          # fires at configure time if the Qt install is missing the
          # ShaderTools or Gui private modules. v0.1.1 silently shipped
          # without GPU spectrum because this flag was implicit; never
          # again.
          #
          # OPENSSL_ROOT_DIR was set into GITHUB_ENV by the "Locate MSYS2
          # OpenSSL (Windows)" step above (Remote Daemon R2, Task 17 fix
          # round 3); passed explicitly here rather than relied on as an
          # ambient env var so find_package(OpenSSL) in CMakeLists.txt
          # cannot silently prefer a different copy.
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DNEREUS_GPU_SPECTRUM=ON \
            -DOPENSSL_ROOT_DIR="$OPENSSL_ROOT_DIR"

      # ------------------------------------------------------------------
      # Build
      # ------------------------------------------------------------------
      - name: Build (Linux/macOS)
        if: runner.os != 'Windows'
        run: cmake --build build -j$(nproc 2>/dev/null || sysctl -n hw.ncpu)

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: cmake --build build -j$NUMBER_OF_PROCESSORS

      # R-R3-21 follow-up from the 2026-09-24 checkpoint. The Linux build
      # above has NEREUS_BUILD_TESTS=ON. The macOS and Windows jobs already
      # build the app with tests off (their configure steps above leave
      # NEREUS_BUILD_TESTS at its OFF default), but the Linux-only sources
      # (the PipeWire bridge and the pipe bus) compile only here, so this
      # is the one build before merge that compiles them with tests off.
      # It builds the app and nereusd a second time in that shape.
      #
      # One shard is enough: every shard builds the same app. It builds in
      # Release, since only compiling and linking matter here, and uses its
      # own ccache directory and cache key: NEREUS_BUILD_TESTS is a PUBLIC
      # definition on NereusCore, so none of these objects match the main
      # build's, and sharing the shard's 500M directory would evict them.
      # The build tree is removed afterwards to keep disk free for the
      # test link.
      - name: Restore tests-off ccache (Linux)
        if: runner.os == 'Linux' && matrix.shard == 0
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache-notests
          key: ccache-notests-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-notests-${{ runner.os }}-

      - name: Build with tests off (Linux)
        if: runner.os == 'Linux' && matrix.shard == 0
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache-notests
        run: |
          ccache --max-size=500M
          ccache --set-config=sloppiness=pch_defines,time_macros,include_file_mtime,include_file_ctime
          ccache --set-config=hash_dir=false
          ccache --zero-stats
          cmake -B build-notests -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_EXE_LINKER_FLAGS_INIT=-fuse-ld=mold \
            -DCMAKE_SHARED_LINKER_FLAGS_INIT=-fuse-ld=mold \
            -DCMAKE_MODULE_LINKER_FLAGS_INIT=-fuse-ld=mold \
            -DNEREUS_BUILD_TESTS=OFF
          cmake --build build-notests -j$(nproc) --target NereusSDR nereusd
          ccache --show-stats
          rm -rf build-notests

      # Build the test executables explicitly.  Every tst_* executable is
      # now EXCLUDE_FROM_ALL, so a routine `cmake --build build` builds
      # only the main app (seconds, not the ~32 minutes it takes to link
      # 513 test binaries).  CI must therefore ask for the `all_tests`
      # aggregate before invoking ctest, or ctest finds the registered
      # test definitions but no binaries and reports every one as
      # "Not Run" -- which exits 0 and would silently pass.
      #
      # Gated on Linux to match the configure step: only the Linux job
      # passes -DNEREUS_BUILD_TESTS=ON (ci.yml:458), and `all_tests` is
      # created by tests/CMakeLists.txt, which is only add_subdirectory'd
      # when that option is ON.  Asking for the target elsewhere would
      # fail with "No rule to make target".
      - name: Build test executables (Linux)
        if: runner.os == 'Linux'
        run: cmake --build build -j$(nproc) --target all_tests

      # ------------------------------------------------------------------
      # Test
      # ------------------------------------------------------------------
      - name: Test
        working-directory: build
        shell: bash
        # 2026-05-12 (PR #238 review P1 #4): drop --no-tests=ignore so
        # a configure that produces zero tests fails loud.  Linux is
        # configured with NEREUS_BUILD_TESTS=ON above; macOS + Windows
        # still configure with tests OFF (the test suite uses Linux-
        # specific PortAudio / Qt 6.4 fakes that haven't been ported
        # to the macOS / mingw paths yet — separate scope).  So
        # macOS + Windows still pass through with zero tests for now;
        # ctest exits 0 with a warning instead of erroring out because
        # there's no test list to run against.  Linux is the source-of-
        # truth gate for the test suite.
        #
        # Ordinary tests select offscreen individually through
        # NEREUS_TESTS_OFFSCREEN in tests/CMakeLists.txt. Native-window
        # tests deliberately keep the caller's platform: their QRhi
        # surfaces need xcb on the virtual X display supplied by xvfb-run.
        # Forcing offscreen here prevents those surfaces from rendering.
        # ALSA_CONFIG_PATH=/dev/null + libasound2 has no audio
        # device on the runner; tests that touch PortAudio must
        # gracefully handle "no devices available" rather than
        # asserting on a successful open.  tst_port_audio_bus is
        # the one outstanding case; tracked as out-of-scope for
        # this PR.
        #
        # QTEST_FUNCTION_TIMEOUT=240000: a QtTest function that hangs is
        # ended by QtTest's own watchdog at 240 s, before ctest's 300 s
        # TIMEOUT kills the process without a trace. The watchdog's crash
        # handler runs gdb (installed above) on the test process and prints
        # every thread's stack into the test's output. It is a diagnostic:
        # no ctest TIMEOUT changes, and a test whose ctest TIMEOUT is 120 s
        # is still ended by ctest first. tst_rendezvous_client sets its own
        # 120 s (tests/CMakeLists.txt), since its hang starts late enough in
        # the process that 240 s would leave gdb no time before 300 s.
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            export QT_QPA_PLATFORM=xcb
            export QTEST_FUNCTION_TIMEOUT=240000
            xvfb-run -a ctest --output-on-failure
          else
            ctest --output-on-failure --no-tests=ignore
          fi

      # ------------------------------------------------------------------
      # PR artifact upload
      # ------------------------------------------------------------------
      # Linux is sharded — every shard rebuilds the same main app, so
      # only shard 0 uploads the artifact to keep the PR's artifact
      # list clean.  macOS / Windows always upload (matrix.shard is
      # empty for them, treated as 0 by the comparison).
      - name: Locate built binary
        if: github.event_name == 'pull_request' && (matrix.shard == 0 || matrix.shard == '')
        id: locate
        shell: bash
        # The app is a thin executable over the NereusSDRLib shared library,
        # so the library has to travel with it or the artifact cannot start.
        # macOS needs no extra entry: the .app already carries its own copy in
        # Contents/Frameworks, staged by the CMake POST_BUILD step.
        #
        # These artifacts were never fully standalone (they still expect Qt,
        # librade and friends from the build environment). The point here is
        # only to keep them exactly as usable as they were before the app
        # became a shared library.
        run: |
          case "${{ runner.os }}" in
            Linux)   printf 'binary<<EOF\nbuild/NereusSDR\nbuild/libNereusSDRLib.so\nbuild/libNereusCore.so\nEOF\n' >> "$GITHUB_OUTPUT" ;;
            macOS)   echo "binary=build/NereusSDR.app" >> "$GITHUB_OUTPUT" ;;
            Windows) printf 'binary<<EOF\nbuild/NereusSDR.exe\nbuild/NereusSDRLib.dll\nbuild/NereusCore.dll\nEOF\n' >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Upload PR build artifact
        if: github.event_name == 'pull_request' && (matrix.shard == 0 || matrix.shard == '')
        uses: actions/upload-artifact@v4
        with:
          # Strip the shard suffix from the artifact name so the Linux
          # binary appears as "Linux x64" not "Linux x64 (1/4)".
          name: NereusSDR-pr${{ github.event.number }}-${{ runner.os == 'Linux' && 'Linux x64' || matrix.name }}
          path: ${{ steps.locate.outputs.binary }}
          retention-days: 7
          if-no-files-found: warn

      # ------------------------------------------------------------------
      # Cache stats
      # ------------------------------------------------------------------
      - name: ccache stats
        if: runner.os != 'Windows'
        run: ccache --show-stats
