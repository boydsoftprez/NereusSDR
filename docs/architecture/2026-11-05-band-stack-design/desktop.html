<style>
/* One dark look on purpose: the NereusSDR workspace look, values from WorkspacePalette.h and sampled from a real capture. */
:root{color-scheme:dark;
 --app:#08080a;--panel:#0c0c0e;--bar:#0a0a0c;--text:#dcdce1;--text2:#a6a6ac;--text3:#6b6b70;--border:#2c2c31;--subtle:#1f1f23;
 --inset:#050507;--insetb:#232329;--green:#4caf6a;--amber:#d8a55f;--amberbg:#33280f;--btnt:#222227;--btnb:#141417;
 --selt:#2f5f92;--selb:#1e3d5f;--selr:#4d89c1;--tx:#c25a5c;--txbg:#3f2224;--danger:#a86b6d;--menu:#1a1a1d;

html,body{background:#050506;color:var(--text);font-family:var(--ui)}

*{box-sizing:border-box}
/* The strip above the window is the mockup's own controls, not part of the product. */

#try button.on{background:linear-gradient(var(--selt),var(--selb));border-color:var(--selr);color:#fff}
#wrap{overflow:hidden}#scale{transform-origin:0 0;width:1512px;height:869px;position:relative}
#stage{width:1512px;height:869px;position:relative;overflow:hidden;background:var(--app);font-size:12px;user-select:none;border-radius:6px}
#top,#srR{position:absolute;display:block;max-width:none}
#top{left:0;top:0;width:1512px;height:32px}
#main{position:absolute;left:0;top:32px;width:1179px;height:791px;display:flex}
#panel{width:0;flex:none;overflow:hidden;background:var(--panel);display:flex;flex-direction:column;position:relative;transition:width .14s ease-out}
#panel.open{border-right:1px solid var(--subtle)}
#stack{flex:1;min-width:0;display:flex;flex-direction:column}#panes{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}#zoom{height:20px;flex:none;position:relative;background:var(--app);cursor:pointer}#zoom i{position:absolute;left:0;right:0;top:8px;height:4px;background:#121216;border:1px solid #2c2c31;border-radius:2px}#zoom u{position:absolute;top:3px;width:14px;height:14px;border-radius:50%;background:#2c4a68;border:1px solid #6d9bc4}
.pan{position:relative;flex:1;min-height:0;border-bottom:3px solid #000;overflow:hidden}
.pan canvas{position:absolute;left:0;display:block}
.dbm{position:absolute;right:0;top:0;width:37px;background:#08080a;font:11px var(--ui);color:var(--text2);z-index:3;border-left:1px solid var(--subtle)}
.dbm b{position:absolute;right:6px;font-weight:400}
.col{position:absolute;left:4px;top:6px;width:72px;display:flex;flex-direction:column;gap:2px;z-index:6}

.cb:hover{border-color:#3d3d41}.cb.lit{background:linear-gradient(var(--selt),var(--selb));border-color:var(--selr);color:#fff}
.fly{position:absolute;left:78px;top:6px;display:grid;grid-template-columns:repeat(4,48px);gap:2px;padding:2px;background:rgba(12,12,14,.95);border:1px solid var(--border);border-radius:4px;z-index:8}
.fly button{height:26px;font:600 11px var(--ui);color:var(--text);background:linear-gradient(var(--btnt),var(--btnb));border:1px solid var(--border);border-radius:3px;cursor:pointer;padding:0}
.fly button:hover{border-color:var(--selr)}.fly button.lit{background:linear-gradient(var(--selt),var(--selb));border-color:var(--selr);color:#fff}
.chrome{position:absolute;top:10px;right:46px;z-index:5;display:flex;gap:2px;padding:2px;background:rgba(12,12,14,.8);border:1px solid var(--subtle);border-radius:3px;font:600 11px var(--mono)}

.live{position:absolute;right:3px;z-index:5;font:600 10px var(--ui);color:var(--text2);background:#232327;border:1px solid var(--border);border-radius:3px;padding:1px 3px}
.zb{position:absolute;left:6px;display:flex;gap:4px;z-index:5}

/* VFO flag, measured from the real flag */
.flag{position:absolute;width:250px;background:#0c0c0e;border:1px solid var(--subtle);border-top:2px solid var(--c);border-radius:0 0 4px 4px;z-index:7;padding:3px 7px 2px;cursor:default}

.flag .mr{display:flex;align-items:center;gap:5px;height:14px}.flag .mt{width:178px;height:14px;background:#10121c;border:1px solid #2a3442;position:relative}.flag .mt u{position:absolute;left:0;top:0;bottom:0;background:#00b4d8}
.flag .db{font:700 11px var(--ui);color:#17d060}
.flag .bt{display:flex;justify-content:space-between;font:700 11px var(--ui);color:#909098;padding:7px 8px 3px}.flag .bt s{text-decoration:none;color:#3d3d41}
.flagside{position:absolute;z-index:7;display:flex;flex-direction:column;gap:3px}
.flagside button{width:17px;height:17px;display:grid;place-items:center;background:#1a1a1d;border:1px solid var(--border);border-radius:50%;color:var(--text);padding:0;cursor:pointer;font:600 11px var(--ui)}
.flagside button.lk{background:none;border:0;border-radius:2px}
.flag.fold{height:auto}
/* The band stack panel */
#ph{height:24px;flex:none;display:flex;align-items:center;gap:5px;padding:0 5px 0 8px;border-bottom:1px solid var(--subtle);font:600 11px var(--ui);letter-spacing:.1em;color:#c4c4ca;white-space:nowrap}
#ph .s{flex:1}#ph button{background:none;border:0;color:var(--text2);cursor:pointer;font:600 12px var(--ui);padding:0 2px}#ph button:hover{color:#fff}
#ptg{height:27px;flex:none;display:flex;align-items:center;gap:4px;padding:0 8px;border-bottom:1px solid var(--subtle);font-size:11px;color:var(--text2);white-space:nowrap;overflow:hidden}
.chip{width:18px;height:18px;border-radius:3px;display:grid;place-items:center;font:700 11px var(--ui);cursor:pointer;border:1px solid var(--c);color:var(--c);background:transparent;padding:0;flex:none}
.chip.on{background:var(--c);color:#fff;text-shadow:0 0 1px #0006}
#pb{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:2px 3px 8px;outline:none;scrollbar-width:thin;scrollbar-color:#3d3d41 transparent}
.sec{display:flex;align-items:center;gap:4px;height:22px;padding:0 4px;font:600 12px var(--ui);color:var(--text2);border-radius:3px;cursor:pointer;margin-top:1px}
.sec:hover{background:#17171b}.sec.cur{color:var(--text)}.sec .ch{width:9px;color:var(--text3);font-size:9px}.sec .n{margin-left:auto;font:11px var(--ui);color:var(--text3);display:flex;gap:4px;align-items:center}
.sec svg{width:9px;height:10px}
.en{position:relative;margin:2px 0 2px 3px;padding:4px 6px 4px 7px;border:1px solid var(--subtle);border-radius:4px;cursor:pointer;background:linear-gradient(90deg,var(--tint,transparent),transparent 75%),#111114;outline:none}
.en:hover{border-color:#3d3d41;background:linear-gradient(90deg,var(--tint,transparent),transparent 75%),#17171b}
.en.act{border-color:var(--selr);background:linear-gradient(90deg,var(--tint,transparent),transparent 75%),linear-gradient(#20344c,#182638)}
.en.kb{box-shadow:0 0 0 1px #8ab7e0 inset}.en.drag{opacity:.7;transform:translateX(4px);border-color:var(--selr)}
.en.flash{animation:fl .6s}@keyframes fl{0%{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber) inset}100%{}}
@media (prefers-reduced-motion:reduce){.en.flash{animation:none}#panel{transition:none}}
.en .f{font:700 14px var(--mono);color:var(--text);line-height:17px}.en.act .f{color:#fff}
.en .m{font-size:10.5px;color:var(--text2);line-height:13px;white-space:nowrap}
.en .d{font-size:10.5px;font-style:italic;color:#7fb2e0;line-height:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.en input{width:100%;font:italic 10.5px var(--ui);color:#fff;background:var(--inset);border:1px solid var(--selr);padding:0 2px;height:15px;outline:none;border-radius:2px;user-select:text}
.en .ic{position:absolute;right:4px;top:4px;display:flex;gap:3px;align-items:center}.en .ic svg{width:10px;height:11px}
.lc{width:13px;height:13px;border-radius:2px;background:var(--c);color:#fff;display:grid;place-items:center;font:700 9px var(--ui);text-shadow:0 0 1px #0006}
#pb.ro .en{opacity:.55;cursor:not-allowed}#pb.ro .add{opacity:.4;cursor:not-allowed}.add{margin:2px 0 3px 3px;height:20px;border:1px dashed #3d3d41;border-radius:4px;color:var(--text2);font-size:11px;display:flex;align-items:center;justify-content:center;gap:4px;cursor:pointer}
.add:hover{border-color:var(--selr);color:#fff}
#pgrip{position:absolute;right:-1px;top:0;bottom:0;width:5px;cursor:col-resize;z-index:3}
/* Menus, toasts and tooltips, from the real captures */
.menu{position:absolute;z-index:40;background:var(--menu);border:1px solid #2c2c31;border-radius:4px;padding:3px 0;min-width:170px;font-size:13px;box-shadow:0 6px 20px #0009}
.mi{height:23px;display:flex;align-items:center;padding:0 12px 0 22px;position:relative;white-space:nowrap;cursor:default;color:var(--text)}
.mi.sel,.mi:hover{background:#2f5f92;color:#fff}.mi.dis{color:#5a5a60;background:none}.mi .mk{position:absolute;left:7px;font-size:11px}.mi .ar{margin-left:auto;padding-left:16px;font-size:9px;color:var(--text2)}.mi .sc{margin-left:auto;padding-left:18px;color:var(--text2);font-size:11px}
.ms{height:1px;background:#2c2c31;margin:3px 0}

.toast{background:#0f0f12;border:1px solid #2c2c31;border-left:3px solid var(--k,#4a7ba8);border-radius:4px;padding:8px 14px 8px 11px;font-size:13px;color:var(--text);display:flex;gap:12px;align-items:center;max-width:680px}
.toast button{font:600 12px var(--ui);color:#fff;background:linear-gradient(var(--selt),var(--selb));border:1px solid var(--selr);border-radius:3px;padding:2px 8px;cursor:pointer}
#tip{position:absolute;z-index:60;background:#17171a;border:1px solid #2c2c31;border-radius:5px;padding:6px 9px;font-size:12px;line-height:17px;color:var(--text);pointer-events:none;white-space:nowrap}
#tip b{font-weight:700}
/* Status bar and the live parts laid over the real capture */
#status{position:absolute;left:0;top:823px;width:1512px;height:46px;background:var(--bar)}
#srR{left:480px;top:0;width:1032px;height:46px}#srLa,#srLb{position:absolute;top:0;height:46px;background-size:480px 46px;background-repeat:no-repeat}#srLa{left:18px;width:82px}#srLb{left:134px;width:398px;background-position:-82px 0}
#dots{position:absolute;left:5px;top:12px;width:11px;height:22px;cursor:pointer;display:flex;flex-direction:column;gap:1px;align-items:center;padding:0}
#dots i{width:9px;height:6px;border-radius:50%;background:var(--text3);display:block}#dots:hover i{background:var(--text2)}
#dots.open i{background:var(--selr)}#dots.auto i{background:var(--amber);box-shadow:0 0 4px #d8a55f}#dots.off i{background:#2c2c31;box-shadow:none}#dots.off{cursor:not-allowed}
.pt{position:absolute;background:var(--bar);white-space:nowrap}
#sBand{left:66px;top:24px;font:700 13px var(--ui);color:var(--green);min-width:64px;line-height:18px}#sBand small{font:600 11px var(--mono);color:var(--text2);margin-left:5px}
#sChip{left:272px;top:15px;width:25px;height:15px;display:grid;place-items:center;border-radius:2px;font:700 11px var(--ui);color:#fff;background:#4a7ba8}

#sFilt{left:459px;padding-left:1px;top:14px;font:700 12.5px var(--mono);color:var(--green);background:#111b16;height:17px;line-height:17px;width:32px}
#sMsg{position:absolute;left:540px;top:15px;font-size:12px;color:var(--text2);transition:opacity .5s;white-space:nowrap}
#plusPan{position:absolute;left:18px;top:6px;width:42px;height:34px;cursor:pointer}
/* Right column: the real capture, with its RX controls live */
#right{position:absolute;left:1179px;top:32px;width:333px;height:791px;overflow:hidden;background:var(--panel)}
#rTop,#rBot{position:absolute;left:0;width:333px;background-repeat:no-repeat;background-size:333px 791px}
#rTop{top:0;height:214px}#rBot{top:214px;height:577px;background-position:0 -214px}
#rBot.shift{top:236px}
#rRow{position:absolute;left:6px;top:215px;height:20px;display:flex;gap:3px;z-index:2}
.rl{position:absolute;z-index:2}
#rLet{left:6px;top:0;}
#rCombo{left:5px;font:13px var(--ui);color:var(--text);background:#1b1b1f;border:1px solid #2c2c31;border-radius:3px;width:308px;height:22px;padding:0 6px;outline:none}
.fb{position:absolute;width:37px;height:20px;background:#141417;border:1px solid #2c2c31;border-radius:4px;font:700 11px var(--ui);color:var(--text);padding:0;cursor:pointer}
.fb.lit{background:linear-gradient(var(--selt),var(--selb));border-color:var(--selr);color:#dfeeff}
#rW{text-align:center;font:600 11.5px var(--ui);color:#4a7ba8;background:var(--panel)}
#rShape{left:7px;width:120px;height:47px;background:#101014}
/* Free container */
#cont{position:absolute;width:232px;z-index:9;background:#111114;border:1px solid var(--border);border-radius:4px;left:820px;top:440px}
#cont .h{height:20px;display:flex;align-items:center;padding:0 6px;font:600 11px var(--ui);letter-spacing:.1em;color:#c4c4ca;cursor:move;border-bottom:1px solid var(--subtle)}
#cont .v{display:flex;align-items:center;gap:6px;padding:4px 7px;font:700 15px var(--mono);color:var(--c,#00d4ff);border-bottom:1px solid var(--subtle)}
#cont .v .bd{margin-left:auto;font:700 12px var(--ui);color:var(--green);cursor:pointer;padding:1px 4px;border-radius:3px}#cont .v .bd:hover{background:#1b1b1f}
#cont .gr{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;padding:5px}
.cbn{height:26px;font:700 11px var(--ui);color:var(--text);background:linear-gradient(var(--btnt),var(--btnb));border:1px solid var(--border);border-radius:4px;cursor:pointer;padding:0}
.cbn.lit{background:linear-gradient(#306247,#1d3d2c);border-color:#3e7e5c;color:#bbe1c6}.cbn:disabled{color:#5a5a60;cursor:not-allowed}
/* The popup a band button's right-click opens */
.bpop{position:absolute;z-index:30;width:190px;background:var(--panel);border:1px solid var(--border);border-radius:5px;box-shadow:0 8px 24px #000a;padding:0 3px 3px;max-height:330px;display:flex;flex-direction:column}

.bpop .bl{overflow:auto;scrollbar-width:thin;scrollbar-color:#3d3d41 transparent}
.dlg{position:absolute;z-index:70;left:50%;top:40%;transform:translate(-50%,-50%);width:420px;background:#111114;border:1px solid var(--border);border-radius:6px;padding:16px;font-size:13px;line-height:18px}
.dlg .bs{display:flex;justify-content:flex-end;gap:6px;margin-top:14px}.dlg button{font:600 12px var(--ui);color:var(--text);background:linear-gradient(var(--btnt),var(--btnb));border:1px solid var(--border);border-radius:4px;padding:4px 12px;cursor:pointer}

<div id="try" aria-label="Mockup controls">

document.addEventListener('mousedown',ev=>{if(!ev.target.closest('.menu'))closeMenus();if(!ev.target.closest('.bpop,#try'))closePop();if(!ev.target.closest('.fly,.col,#cont,#try,.cfd')&&S.flyPan!=null){S.flyPan=null;renderPans()}});
$('#pb').addEventListener('keydown',ev=>{const s=active();const vis=$$('#pb .en').map(r=>S.entries.find(e=>e.id==r.dataset.id));if(!vis.length)return;let i=vis.findIndex(e=>e.id==S.kb);if(i<0)i=vis.findIndex(e=>s.cursor[e.band]==e.id);const e=vis[Math.max(0,i)];const k=ev.key;
 if(k=='ArrowDown'||k=='ArrowUp'){ev.preventDefault();S.kb=vis[Math.max(0,Math.min(vis.length-1,i+(k=='ArrowDown'?1:-1)))].id;renderPanel();const r=$('.en.kb');if(r)r.scrollIntoView({block:'nearest'});return}
 if(k=='Enter'){goto(s,e);return}if(k=='Escape'){S.open=false;render();setTimeout(()=>{sizePans();renderFlags()},160);return}if(k=='F2'){ev.preventDefault();rename(e,findRow(e));return}
 if((ev.metaKey||ev.ctrlKey)&&k.toLowerCase()=='u'){ev.preventDefault();e.locked=!e.locked;render();$('#pb').focus();return}if(k=='Delete'||k=='Backspace'){ev.preventDefault();del(e);$('#pb').focus()}});
let gripX;$('#pgrip').addEventListener('mousedown',ev=>{ev.preventDefault();ev.stopPropagation();const sx=ev.clientX,sw=S.width;$('#panel').style.transition='none';const mv=m=>{S.width=Math.max(120,Math.min(240,sw+(m.clientX-sx)/scaleF));$('#panel').style.width=S.width+'px';sizePans();renderFlags()};const up=()=>{document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up);$('#panel').style.transition='';};document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up)});
(()=>{const z=$('#zoom');const set=ev=>{const r=z.getBoundingClientRect();const k=Math.max(0,Math.min(1,((ev.clientX-r.left)/scaleF-7)/(z.clientWidth-14)));const p=zoomOf();p.span=Math.round(MINSPAN*Math.pow(MAXSPAN/MINSPAN,k));render()};z.addEventListener('mousedown',ev=>{set(ev);const up=()=>{document.removeEventListener('mousemove',set);document.removeEventListener('mouseup',up)};document.addEventListener('mousemove',set);document.addEventListener('mouseup',up)})})();
function fit(){const w=$('#wrap').clientWidth;const av=window.innerHeight-$('#try').offsetHeight-24;scaleF=Math.min(1,w/1512);if(av>200&&window.innerWidth>700)scaleF=Math.min(scaleF,Math.max(av/869,.45));$('#scale').style.transform=`scale(${scaleF})`;$('#wrap').style.height=869*scaleF+'px'}
window.addEventListener('resize',fit);new ResizeObserver(()=>{if(S)S.pans.forEach(p=>{})}).observe($('#panes'));
init();S.lastBand=bandOf(active().f);fit();render();loop();
</script>
