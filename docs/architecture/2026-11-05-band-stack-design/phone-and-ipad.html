<style>
/* One dark look on purpose: the phone's workspace look, values from ios/Shared/WorkspacePalette.swift and ChromeColours. */
:root{color-scheme:dark;--app:#08080a;--panel:#0c0c0e;--bar:#0a0a0c;--text:#dcdce1;--dim:#a6a6ac;--faint:#7e7e85;--inact:#58585e;--border:#2c2c31;--subtle:#1f1f23;--muted:#3d3d41;

html,body{background:#050506;color:var(--text);font-family:var(--ui)}
body{padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button{font-family:inherit}
#try{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:12px;color:var(--dim);margin-bottom:8px}
#try .g{display:flex;gap:3px;align-items:center;flex-wrap:wrap}#try .g>span{margin-right:4px}
#try button{font-size:12px;color:var(--text);background:linear-gradient(var(--btnt),var(--btnb));border:1px solid var(--border);border-radius:4px;padding:3px 8px;cursor:pointer}
#try button.on{background:linear-gradient(var(--selt),var(--selb));border-color:var(--selr);color:#fff}
#wrap{overflow:hidden;display:flex;justify-content:center}#scale{transform-origin:0 0;flex:none}
#dev{position:relative;overflow:hidden;background:var(--app);user-select:none;border-radius:34px;outline:6px solid #232327;outline-offset:-1px;font-size:13px}
#dev.ipad{border-radius:18px}
.lay{position:absolute;left:0;top:0;right:0;bottom:0;pointer-events:none}.lay>*{pointer-events:auto}
img.cap{position:absolute;display:block;max-width:none}
#band{position:absolute;overflow:hidden;touch-action:none;cursor:crosshair;background:#08080a}
#band canvas{position:absolute;left:0;display:block}
/* Parts drawn from their SwiftUI sources */
.btn{background:linear-gradient(var(--btnt),var(--btnb));border:1px solid var(--border);border-radius:7px;color:var(--text);font:700 12px var(--ui);padding:0;cursor:pointer}
.btn.lit{background:linear-gradient(var(--selt),var(--selb));border-color:var(--selr);color:var(--seltx)}
.btn:disabled{color:var(--inact);cursor:not-allowed}
#col{position:absolute;display:grid;gap:2px;padding:2px;z-index:12}
#col .btn{width:80px;height:30px}
.flag{position:absolute;width:199px;background:rgba(12,12,14,.93);border:1px solid var(--subtle);border-top:2px solid var(--c);border-radius:0 0 5px 5px;z-index:7;cursor:default}
.flag .r1{display:flex;align-items:center;height:44px;padding:0 4px 0 22px;font:700 11.5px var(--ui)}
.flag .ants{line-height:17px}.flag .rx{color:#4a8cff}.flag .tx{color:var(--red)}.flag .sep{width:1px;height:24px;background:var(--muted);margin:0 7px}
.flag .w{color:#14a6d6}.flag .txb{color:#6c3a3c;font-weight:700;margin-left:6px;width:36px;text-align:center}.flag .txb.on{color:var(--red)}
.flag .sp{flex:1}.flag .let{background:var(--c);color:#fff;width:20px;height:20px;border-radius:3px;display:grid;place-items:center;text-shadow:0 0 1px #0007}
.flag .fq{margin:0 5px;border:1px solid var(--border);border-radius:3px;height:38px;font:700 26px var(--mono);color:#00e5ff;text-align:right;padding-right:2px;line-height:36px;background:#0a0a0c;letter-spacing:-.6px}
.flag .fq small{font-size:26px}
.flag .mt{margin:16px 5px 0;width:135px;height:11px;background:#050507;border:1px solid var(--border)}.flag .mt u{display:block;height:100%;background:#00a8d0}
.flag .bt{display:flex;align-items:center;justify-content:space-around;font:700 12px var(--ui);color:#8e8e94;height:38px;border-top:1px solid var(--subtle);margin-top:2px}.flag .bt s{width:1px;height:16px;background:var(--muted)}
.rnd{position:absolute;width:43px;height:43px;border-radius:50%;background:rgba(20,20,24,.86);border:1px solid var(--subtle);color:var(--text);display:grid;place-items:center;z-index:7;padding:0;cursor:pointer}
.tag{position:absolute;z-index:6;display:flex;align-items:center;gap:6px;height:30px;padding:0 7px;background:rgba(12,12,14,.93);border:1px solid var(--subtle);border-top:2px solid var(--c);border-radius:0 0 5px 5px;font:700 15px var(--mono);color:var(--c);cursor:pointer;white-space:nowrap}
.tag .let{background:var(--c);color:#fff;font:700 11px var(--ui);width:17px;height:17px;border-radius:3px;display:grid;place-items:center;text-shadow:0 0 1px #0007}
.mk{position:absolute;z-index:5;display:flex;align-items:center;gap:4px;height:26px;padding:0 7px 0 6px;background:rgba(12,12,14,.86);border:1px solid #33506d;border-radius:6px;font:600 11px var(--mono);color:#a9c7e4;cursor:pointer;white-space:nowrap}
.mk i{width:7px;height:7px;border-radius:50%;background:#6ea5d8}.mk.act{border-color:#6b5426;color:#ecd3a9}.mk.act i{background:var(--amber)}
.mk svg{width:9px;height:10px}
#ptt{position:absolute;width:76px;height:76px;border-radius:50%;background:rgba(63,34,36,.75);border:2px solid #7a3d3f;color:#d59a9c;z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:center;font:800 18px var(--ui);cursor:pointer;padding:0;letter-spacing:.5px}
#ptt small{font:500 11px var(--ui);color:#a07c7d;letter-spacing:0;margin-top:1px}#ptt.on{background:#7a2c2e;border-color:#e08486;color:#fff}#ptt.on small{color:#f0dcdc}
#zoom{position:absolute;display:flex;width:100px;height:42px;z-index:8;background:rgba(26,26,30,.92);border:1px solid var(--border);border-radius:8px;overflow:hidden}
#zoom button{flex:1;background:none;border:0;color:var(--text);font:600 22px var(--ui);padding:0;cursor:pointer;line-height:1}#zoom button+button{border-left:1px solid var(--border)}
#arrows{position:absolute;right:0;width:39px;height:51px;z-index:4;background:rgba(26,26,30,.9);border:1px solid var(--border);border-radius:7px 0 0 7px;color:var(--text);font-size:10px;display:flex;flex-direction:column;align-items:center;justify-content:space-around;padding:4px 0}
/* Drop sheet: DropSheet.swift */
.sheet{position:absolute;z-index:20;background:#121215;border:1px solid var(--muted);border-radius:10px;box-shadow:0 10px 28px #000b;display:flex;flex-direction:column;overflow:hidden}
.sheet>.tt{height:22px;flex:none;display:flex;align-items:center;gap:6px;padding:0 8px;background:linear-gradient(#26262b,#1d1d21 50%,#17171a);border-bottom:1px solid var(--border);font:700 11px var(--ui);color:#c4c4ca}
.sheet>.tt .sp{flex:1}.sheet>.tt em{font:600 11px var(--ui);color:var(--dim);letter-spacing:.4px;display:flex;align-items:center;gap:5px}
.sheet>.bd{overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:9px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.cap1{font-size:11px;color:var(--dim)}.note{font-size:11px;color:var(--dim);line-height:15px}.note.warn{color:var(--refuse)}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.grid4 .btn,.grid2 .btn,.grid3 .btn{height:36px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.chip{width:15px;height:15px;border-radius:3px;background:var(--c);color:#fff;font:700 10px var(--ui);display:inline-grid;place-items:center;text-shadow:0 0 1px #0007;flex:none}
/* The new band stack block */
.stk{display:flex;flex-direction:column;gap:0;border-top:1px solid var(--subtle);padding-top:8px}
.stk .hd{display:flex;align-items:center;gap:5px;height:34px;margin-bottom:5px}
.stk .pick{height:32px;padding:0 9px;display:flex;align-items:center;gap:5px}.stk .pick u{text-decoration:none;font-size:9px;color:var(--dim)}
.stk .ofn{font:600 11.5px var(--mono);color:var(--dim);white-space:nowrap}.stk .sp{flex:1}
.stk .ar{width:38px;height:32px;font-size:13px}.stk .mo{width:34px;height:32px;font-size:15px;letter-spacing:1px}
.row{position:relative;display:flex;align-items:center;min-height:46px;margin-bottom:3px;padding-left:9px;border:1px solid var(--subtle);border-radius:7px;background:linear-gradient(90deg,var(--tint,transparent),transparent 72%),#17171b;cursor:pointer;touch-action:pan-y}
.row.act{border-color:var(--selr);background:linear-gradient(var(--selt),var(--selb));}
.row.fl{animation:fl .7s}@keyframes fl{0%{box-shadow:0 0 0 2px var(--amber) inset}100%{}}
@media (prefers-reduced-motion:reduce){.row.fl{animation:none}}
.row .tx{flex:1;min-width:0;padding:4px 0}.row .f{font:700 15.5px var(--mono);line-height:19px;color:var(--text)}.row.act .f{color:#fff}
.row .m{font-size:11px;line-height:14px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row.act .m{color:var(--seltx)}
.row .m i{color:#8dbbe6}.row.act .m i{color:#dbe9f8}
.row input{width:100%;height:17px;font:italic 11px var(--ui);color:#fff;background:var(--inset);border:1px solid var(--selr);border-radius:3px;outline:none;padding:0 3px;user-select:text;display:block}
.row .ic{display:flex;align-items:center;gap:4px;margin-right:3px}.row .ic svg{width:11px;height:12px}
.row .dt{width:40px;height:44px;background:none;border:0;color:var(--dim);font-size:16px;letter-spacing:1px;cursor:pointer;padding:0;flex:none}.row.act .dt{color:var(--seltx)}
.row .gr{width:40px;height:44px;display:grid;place-items:center;color:var(--dim);cursor:grab;flex:none;touch-action:none}
.row.drag{opacity:.75;transform:translateX(5px);z-index:2}
.ro .row{opacity:.55;cursor:not-allowed}
.stk .ft{display:grid;grid-template-columns:1fr 92px;gap:6px;margin-top:5px}.stk .ft .btn{height:36px}
a.lnk{font-size:12px;color:var(--text);font-weight:600;cursor:pointer;padding:4px 0 2px;display:block}
/* Column menu: BandButtonColumn.swift, ColumnMenuShell */
.cm{position:absolute;z-index:14;background:linear-gradient(#17171b,#0e0e10);border:1px solid var(--border);border-radius:10px;box-shadow:0 10px 28px #000b;display:flex;overflow:hidden}
.cm .pn{overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:9px;scrollbar-width:none;width:236px;flex:none}
.cm .pn+.pn{border-left:1px solid var(--subtle)}.cm .pn .stk{border-top:0;padding-top:0}.cm .grid4{gap:3px}.cm .grid4 .btn{height:34px}
.cm.one .pn .stk{border-top:1px solid var(--subtle);padding-top:6px}
.cm .row .f{font-size:14.5px}

.ism .i{min-height:42px;display:flex;align-items:center;padding:0 14px 0 34px;position:relative;border-top:.5px solid rgba(255,255,255,.1);cursor:pointer;color:#f2f2f4}

.ism .sg{height:7px;background:rgba(0,0,0,.25)}

.pat{position:absolute;z-index:9;pointer-events:none}
</style>

</div>
