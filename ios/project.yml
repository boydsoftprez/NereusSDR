# NereusSDR for iOS: the Xcode project, generated by XcodeGen
# SPDX-License-Identifier: GPL-3.0-or-later WITH AdditionRef-NereusSDR-AppStore-permission
#
# ios/scripts/generate-project.sh writes ios/NereusSDR.xcodeproj from this
# file; the project itself is never committed.

name: NereusSDR

options:
  bundleIdPrefix: com.boydsoftprez
  deploymentTarget:
    iOS: "17.4"
  createIntermediateGroups: true
  groupSortPosition: top

configFiles:
  Debug: Config/Team.xcconfig
  Release: Config/Team.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "2026.9.0"
    # The build number for a build from Xcode's own window. The scripts'
    # builds (device-install.sh) set it to the commit count of HEAD, from
    # scripts/build-number.sh, so it rises with every commit.
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

packages:
  NereusKit:
    path: NereusKit

targets:
  NereusSDR:
    type: application
    platform: iOS
    sources:
      - path: NereusApp
        excludes:
          - "Tests/**"
          - "UITests/**"
          - "Info.plist"
          - "NereusSDR.entitlements"
          - "Resources/Shaders"
      # The shaders ship as source and compile at run time, so building
      # needs no Metal toolchain: a folder reference is copied as it is,
      # where a .metal file in the target would be compiled.
      - path: NereusApp/Resources/Shaders
        type: folder
        buildPhase: resources
      - path: Shared
    dependencies:
      - package: NereusKit
        product: NereusKit
      - target: NereusActivity
    settings:
      base:
        PRODUCT_NAME: NereusSDR
        PRODUCT_BUNDLE_IDENTIFIER: com.boydsoftprez.NereusSDR.ios
        INFOPLIST_FILE: NereusApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: NereusApp/NereusSDR.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      # The PTT button test (plan Task 65 step 1) is built into Debug
      # copies only: a Release build, and so every archive, carries none
      # of it.
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) PTT_PROBE"

  NereusActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: NereusActivity
        excludes:
          - "Info.plist"
      - path: Shared
      # The Live Activity's buttons: iOS runs a Live Activity intent in the
      # app's process, and asks for it in both the app and the widget.
      - path: NereusApp/Activity/UnkeyIntent.swift
      - path: NereusApp/Activity/MuteIntent.swift
      - path: NereusApp/Activity/CancelReconnectingIntent.swift
      - path: NereusApp/Activity/ReconnectIntent.swift
    settings:
      base:
        PRODUCT_NAME: NereusActivity
        PRODUCT_BUNDLE_IDENTIFIER: com.boydsoftprez.NereusSDR.ios.activity
        INFOPLIST_FILE: NereusActivity/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES

  NereusSDRTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NereusApp/Tests
    dependencies:
      - target: NereusSDR
      - package: NereusKit
        product: NereusKitTesting
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.boydsoftprez.NereusSDR.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) PTT_PROBE"

  NereusSDRUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: NereusApp/UITests
        excludes:
          - "Info.plist"
    dependencies:
      - target: NereusSDR
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.boydsoftprez.NereusSDR.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
        # Carries the same NereusBuildTag as the app, so the UI test knows
        # which build row to expect.
        INFOPLIST_FILE: NereusApp/UITests/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        TEST_TARGET_NAME: NereusSDR

schemes:
  NereusSDR:
    build:
      targets:
        NereusSDR: all
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - NereusSDRTests
        - NereusSDRUITests
        # NereusKit's own tests, on the simulator.
        - package: NereusKit/NereusModelsTests
        - package: NereusKit/NereusLinkTests
        - package: NereusKit/NereusMirrorTests
        - package: NereusKit/NereusMediaTests
        - package: NereusKit/NereusKitTestingTests
        - package: NereusKit/NereusBandTests
    run:
      config: Debug
    archive:
      config: Release
